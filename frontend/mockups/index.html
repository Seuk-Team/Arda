     <div class=\"nav\" style=\"margin-top:0; min-width:160px; flex:none;\">\r\n          <a href=\"#\" class=\"active\" data-stage=\"0\">서류 검토</a>\r\n          <a href=\"#\" data-stage=\"1\">면접</a>\r\n          <a href=\"#\" data-stage=\"2\">최종 합격</a>\r\n          <a href=\"#\" data-stage=\"3\">불합격</a>\r\n        </div>\r\n        <div style=\"flex:1; min-width:280px;\">\r\n          <div class=\"tfield\" style=\"margin-bottom:var(--sp-3);\">\r\n            <label for=\"tpl-subject\">제목</label>\r\n            <input class=\"tinput\" id=\"tpl-subject\" type=\"text\" value=\"(문구 작성 중)\">\r\n          </div>\r\n          <label style=\"font-family:var(--sans); font-size:var(--font-sm); font-weight:600; color:var(--text); display:block; margin-bottom:var(--sp-2);\">본문</label>\r\n          <textarea class=\"ninput\" id=\"tpl-body\" rows=\"8\" style=\"min-height:200px;\">(문구 작성 중)</textarea>\r\n          <div style=\"display:flex; justify-content:flex-end; margin-top:var(--sp-2);\">\r\n            <button class=\"btn btn-primary\">저장</button>\r\n          </div>\r\n        </div>\r\n      </div>\r\n    </div>\r\n  </main>\r\n</div>\r\n\r\n\r\n\r\n<aside class=\"apanel\" id=\"apanel\" aria-label=\"아르 에이전트\">\r\n  <div class=\"ainner\">\r\n    <div class=\"ahead\">\r\n      <svg class=\"agchar\" id=\"agCharMain\" viewBox=\"0 0 24 24\" role=\"img\" aria-hidden=\"true\">\r\n  <g class=\"agbody\">\r\n    <circle cx=\"12\" cy=\"15\" r=\"7\" fill=\"#8CC63F\"/>\r\n    <path class=\"agleafL\" d=\"M12 8 C 12 4, 8 3, 6 4 C 7 7, 10 8, 12 8\" fill=\"#3A6B21\"/>\r\n    <path class=\"agleafR\" d=\"M12 8 C 12 5, 16 3.5, 18 4.5 C 17 7.5, 13 8, 12 8\" fill=\"#8CC63F\"/>\r\n    <path class=\"agnewleaf\" d=\"M12 7.5 C 11 5, 12.5 2.5, 14.5 2 C 15 4.5, 13.5 6.5, 12 7.5\" fill=\"#8CC63F\"/>\r\n    <circle class=\"ageye\" cx=\"9.5\" cy=\"14.5\" r=\"1\" fill=\"#1B2117\"/>\r\n    <circle class=\"ageye\" cx=\"14.5\" cy=\"14.5\" r=\"1\" fill=\"#1B2117\"/>\r\n    <path class=\"agmouth\" d=\"M10 17.5 q2 1.5 4 0\" stroke=\"#1B2117\" stroke-width=\"1\" fill=\"none\" stroke-linecap=\"round\"/>\r\n  </g>\r\n</svg>\r\n      <div><div class=\"aname\">아르</div></div>\r\n      <button class=\"aclose\" id=\"aclose\" aria-label=\"에이전트 닫기\"><svg viewBox=\"0 0 24 24\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg></button>\r\n    </div>\r\n    <div class=\"alog\" id=\"alog\" role=\"log\" aria-live=\"polite\"></div>\r\n    <div class=\"ainput-row\">\r\n      <div class=\"ainput\">\r\n        <input id=\"ainputEl\" placeholder=\"채용 업무를 맡겨보세요\" aria-label=\"에이전트 명령 입력\">\r\n        <button type=\"button\" class=\"amic\" id=\"amic\" aria-label=\"음성 입력\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"/><path d=\"M5 11a7 7 0 0 0 14 0M12 18v3\"/></svg></button>\r\n      </div>\r\n      <button type=\"button\" class=\"asend\" id=\"asend\" aria-label=\"전송\" disabled><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/><polyline points=\"13 6 19 12 13 18\"/></svg></button>\r\n    </div>\r\n  </div>\r\n</aside>\r\n\r\n\r\n","js":"\r\nvar tabBtns=document.querySelectorAll('.tabs button');\r\nvar panels=document.querySelectorAll('[role=\"tabpanel\"]');\r\ntabBtns.forEach(function(btn,i){\r\n  btn.addEventListener('click',function(){\r\n    tabBtns.forEach(function(b){ b.setAttribute('aria-selected','false'); });\r\n    panels.forEach(function(p){ p.hidden=true; });\r\n    btn.setAttribute('aria-selected','true');\r\n    panels[i].hidden=false;\r\n  });\r\n});\r\n\r\nvar stageLinks=document.querySelectorAll('#panel-mail .nav a');\r\nvar tplSubject=document.getElementById('tpl-subject');\r\nvar tplBody=document.getElementById('tpl-body');\r\nvar TEMPLATES=[\r\n  {subject:'(문구 작성 중)', body:'(문구 작성 중)'},\r\n  {subject:'(문구 작성 중)', body:'(문구 작성 중)'},\r\n  {subject:'(문구 작성 중)', body:'(문구 작성 중)'},\r\n  {subject:'(문구 작성 중)', body:'(문구 작성 중)'}\r\n];\r\nstageLinks.forEach(function(link){\r\n  link.addEventListener('click',function(e){\r\n    e.preventDefault();\r\n    stageLinks.forEach(function(l){ l.classList.remove('active'); });\r\n    link.classList.add('active');\r\n    var idx=parseInt(link.getAttribute('data-stage'),10);\r\n    tplSubject.value=TEMPLATES[idx].subject;\r\n    tplBody.value=TEMPLATES[idx].body;\r\n  });\r\n});\r\n\n\r\n/* ── 아르 에이전트 배선 (인수인계 데모와 동일 흐름) ────────────────\r\n   캐릭터 상태: setChar('enter'|'listen'|'think'|'ask'|'confirm'|'fail'|'')\r\n   쓰기 도구는 반드시 앰버 확인 카드 → [확인] 을 거친다 (ADR-0003). */\r\n(function(){\r\nvar ap=document.getElementById('apanel'), slot=document.getElementById('agSlot');\r\nvar log=document.getElementById('alog'), input=document.getElementById('ainputEl');\r\nvar mic=document.getElementById('amic');\r\nvar send=document.getElementById('asend');\r\nvar chars=[document.getElementById('agCharMain'), slot.querySelector('.agchar')];\r\nfunction setChar(s){ chars.forEach(function(c){ if(!c) return;\r\n  c.classList.remove('enter','listen','think','ask','confirm','fail');\r\n  void c.getBoundingClientRect(); if(s) c.classList.add(s); }); }\r\nfunction openAg(){ ap.classList.add('open'); localStorage.setItem('arda-open','1'); slot.classList.remove('pending');\r\n  var _dp=document.getElementById('dpanel'); if(_dp) _dp.classList.remove('open');\r\n  setChar('enter'); setTimeout(function(){ setChar(''); }, 500);\r\n  setTimeout(function(){ input.focus(); }, 300); }\r\nfunction closeAg(){ ap.classList.remove('open'); localStorage.removeItem('arda-open'); setChar(''); mic.classList.remove('on');\r\n  input.placeholder='채용 업무를 맡겨보세요'; }\r\nslot.addEventListener('click', function(){ ap.classList.contains('open')?closeAg():openAg(); });\r\ndocument.getElementById('aclose').addEventListener('click', closeAg);\r\ndocument.addEventListener('keydown', function(e){\r\n  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openAg(); }\r\n  /* Esc 는 상세 패널도 쓴다. 에이전트가 열려 있을 때만 삼키고, 아니면 원래 핸들러에 넘긴다. */\r\n  if(e.key==='Escape' && ap.classList.contains('open')){ e.stopPropagation(); closeAg(); }\r\n}, true);\r\nmic.addEventListener('click', function(){\r\n  var on=mic.classList.toggle('on'); setChar(on?'listen':'');\r\n  input.placeholder = on ? '듣고 있어요…' : '채용 업무를 맡겨보세요';\r\n});\r\nfunction el(cls, html){ var d=document.createElement('div'); d.className=cls; d.innerHTML=html; return d; }\r\nfunction scrollEnd(){ log.scrollTop=log.scrollHeight; }\r\nvar CHAR_SM='<svg class=\"agchar\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">'+document.getElementById('agCharMain').innerHTML+'<\\/svg>';\r\ninput.addEventListener('input', function(){ if(send) send.disabled=!input.value.trim(); });\r\nif(send) send.addEventListener('click', function(){ input.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true})); });\r\ninput.addEventListener('keydown', function(e){\r\n  if(e.key!=='Enter' || !input.value.trim()) return;\r\n  var q=input.value.trim(); input.value=''; mic.classList.remove('on'); if(send) send.disabled=true;\r\n  log.appendChild(el('amsg-user', q)); scrollEnd();\r\n  setChar('think');\r\n  setTimeout(function(){\r\n    log.appendChild(el('atool', '✓ 검색: 기술 Python · 경력 2년 이상<br>✓ 결과 3명 — 박서연 · 이준호 · 최유진')); scrollEnd();\r\n  }, 700);\r\n  setTimeout(function(){\r\n    setChar('ask'); slot.classList.add('pending');\r\n    var row=el('arow-ai', CHAR_SM+\r\n      '<div class=\"acard-ai\">3명을 <b>서류 검토 → 면접</b> 단계로 옮길까요?'+\r\n      '<div class=\"abtns\"><button type=\"button\" class=\"abtn-ok\">확인</button>'+\r\n      '<button type=\"button\" class=\"abtn-no\">취소</button></div></div>');\r\n    row.querySelector('.abtn-ok').addEventListener('click', function(){\r\n      row.querySelector('.abtns').remove(); slot.classList.remove('pending');\r\n      setChar('confirm');\r\n      log.appendChild(el('acard-done', '✓ 3명을 면접 단계로 옮겼어요. 단계 이력에 기록됐습니다.')); scrollEnd();\r\n      setTimeout(function(){ setChar(''); }, 900);\r\n    });\r\n    row.querySelector('.abtn-no').addEventListener('click', function(){\r\n      row.querySelector('.abtns').remove(); slot.classList.remove('pending');\r\n      setChar('fail');\r\n      log.appendChild(el('atool', '취소했어요. 변경 없음.')); scrollEnd();\r\n      setTimeout(function(){ setChar(''); }, 1200);\r\n    });\r\n    log.appendChild(row); scrollEnd();\r\n  }, 1500);\r\n});\r\nif(localStorage.getItem('arda-open')==='1') ap.classList.add('open');\r\n})();\r\n"},
  "mockup-posting-new.html": {"css":"\r\n:root{\r\n  --bg:#F4F7F0;\r\n  --sidebar-bg:#C7E49B;    /* 연두: 확실히 초록으로 읽히되 어둡지 않은 중간 톤 */\r\n  --sidebar-line:#A8CD6E;  /* 사이드바 오른쪽 경계선: 배경보다 한 단계 진한 연두 1px */\r\n  --border-w:1px;\r\n  --sidebar-w:216px;\r\n  --content-x:48px;\r\n  --text:#1B2117;\r\n  --text-sub:#5C6654;\r\n  --leaf:#3A6B21;\r\n  --leaf-strong:#2C5218;\r\n  --danger:#A9503C;\r\n  --ai:#A9702A;            /* AI 제안 — 앰버 점선 규약 (05-design 확정) */\r\n  --ai-soft:#FBF2E5;       /* AI 제안 워시 */\r\n  --sans:\"IBM Plex Sans KR\",system-ui,\"Malgun Gothic\",sans-serif;\r\n  --font-num:14px;\r\n  --font-display:26px; --font-h1:22px; --font-h2:18px; --font-body:16px; --font-sm:14px; --font-caption:12px;\r\n  --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:40px; --sp-8:48px;\r\n  --r-ctl:6px; --r-card:8px;\r\n  --bg-elev:#FFFFFF;\r\n  --border:#DCE3D4;\r\n  --border-soft:#EAEFE4;\r\n  --bg-sunken:#EBF0E5;     /* 인풋·트랙: 패널보다 한 단계 아래 */\r\n  --sunken-hover:#DCE3D4;  /* sunken 바탕 위 hover 채움: 한 톤 진하게 */\r\n  --ts-heading:0 1px 0 rgba(27,33,23,.34);\r\n  --ts-onfill:0 1px 0 rgba(0,0,0,.62);\r\n  --z-sticky:10;\r\n  --dur-fast:120ms; --dur-base:200ms; --ease:cubic-bezier(.2,0,0,1);\r\n}\r\n@media (prefers-reduced-motion: reduce){ *{ transition-duration:0ms !important; } }\r\n*{ box-sizing:border-box; margin:0; }\r\nbody{ background:var(--bg); height:100vh; display:flex; overflow:hidden; }\r\n.sidebar{ width:var(--sidebar-w); flex:none; background:var(--sidebar-bg);\r\n          border-right:var(--border-w) solid var(--sidebar-line);\r\n          padding:var(--sp-4) var(--sp-2) 0; }\r\n.logo{ font-family:var(--sans); font-size:var(--font-h1); font-weight:700; letter-spacing:-.01em;\r\n       color:var(--text); text-shadow:var(--ts-heading); white-space:nowrap; padding:0 var(--sp-3); }\r\n.logo .seed{ color:var(--leaf); }\r\n.nav{ margin-top:var(--sp-6); display:flex; flex-direction:column; gap:2px; font-family:var(--sans); }\r\n.nav a{ display:flex; align-items:center; gap:var(--sp-3); min-height:48px; color:var(--text); text-decoration:none;\r\n        font-size:var(--font-body); font-weight:500;\r\n        padding:0 var(--sp-3); border-radius:var(--r-ctl); white-space:nowrap;\r\n        transition:background var(--dur-fast) var(--ease); }\r\n.nav a svg{ width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8;\r\n            stroke-linecap:round; stroke-linejoin:round; }\r\n.me{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:var(--sp-2);\r\n     padding:var(--sp-3); border-top:var(--border-w) solid var(--sidebar-line);\r\n     font-family:var(--sans); white-space:nowrap; }\r\n.me .name{ font-size:var(--font-body); font-weight:600; color:var(--text); }\r\n.me .role{ font-size:var(--font-sm); color:var(--leaf); margin-top:2px; }\r\n.me .avatar{ width:44px; height:44px; flex:none; border-radius:50%; background:var(--bg-elev);\r\n             border:var(--border-w) solid var(--sidebar-line);\r\n             display:flex; align-items:center; justify-content:center;\r\n             font-size:var(--font-h2, 18px); font-weight:700; color:var(--leaf); }\r\n.sidebar{ display:flex; flex-direction:column; }\r\n.main{ flex:1; min-width:0; display:flex; flex-direction:column; }\r\n.head{ flex:none; min-height:96px; background:var(--bg-elev);\r\n       border-bottom:var(--border-w) solid #DCE3D4;\r\n       padding:var(--sp-4) var(--content-x);\r\n       display:flex; flex-direction:column; justify-content:center; }\r\n.head .title{ font-family:var(--sans); font-size:var(--font-display); font-weight:700; letter-spacing:-.01em;\r\n              color:var(--text); text-shadow:var(--ts-heading); white-space:nowrap;\r\n              overflow:hidden; text-overflow:ellipsis; }\r\n.head-top{ display:flex; align-items:center; gap:var(--sp-3); min-width:0; }\r\n.head-top .title{ line-height:1.2; }\r\n.back{ width:36px; height:36px; flex:none; display:flex; align-items:center; justify-content:center;\r\n       background:var(--bg-elev); border:var(--border-w) solid #DCE3D4; border-radius:var(--r-ctl);\r\n       cursor:pointer; transition:background var(--dur-fast) var(--ease); }\r\n.back:hover{ background:#EBF0E5; }\r\n.back:active{ background:#DCE3D4; }\r\n.back:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.back svg{ width:20px; height:20px; stroke:var(--text); fill:none; stroke-width:2;\r\n           stroke-linecap:round; stroke-linejoin:round; }\r\n.content{ flex:1; min-height:0; overflow-y:auto; padding:var(--sp-5) var(--content-x); }\r\n.btn{ font-family:var(--sans); font-size:var(--font-sm); font-weight:600; white-space:nowrap;\r\n      height:40px; padding:0 var(--sp-4); border-radius:var(--r-ctl); border:var(--border-w) solid transparent;\r\n      cursor:pointer; transition:background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease); }\r\n.btn:active{ transform:translateY(1px); }\r\n.btn:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.btn-primary{ background:var(--leaf); color:#fff; text-shadow:var(--ts-onfill); }\r\n.btn-primary:hover{ background:#2C5218; }\r\n.btn-primary:disabled{ background:#C7D0BC; color:var(--text-sub); text-shadow:none; cursor:not-allowed; }\r\n.tfield{ display:flex; flex-direction:column; gap:var(--sp-2); }\r\n.tfield label{ font-family:var(--sans); font-size:var(--font-sm); font-weight:600; color:var(--text); }\r\n.tinput{ width:100%; height:40px; padding:0 var(--sp-3);\r\n         border:var(--border-w) solid var(--border); border-radius:var(--r-ctl);\r\n         background:var(--bg-elev); font-family:var(--sans); font-size:var(--font-body); color:var(--text);\r\n         transition:border-color var(--dur-fast) var(--ease); }\r\n.tinput::placeholder{ color:var(--text-sub); }\r\n.tinput:hover{ border-color:var(--sunken-hover); }\r\n.tinput:focus-visible{ outline:2px solid var(--leaf); outline-offset:1px; border-color:var(--leaf); }\r\n.tinput:disabled{ background:var(--bg-sunken); color:var(--text-sub); cursor:not-allowed; }\r\n.ninput{ display:block; width:100%; min-height:76px; resize:vertical; margin-bottom:var(--sp-2);\r\n         padding:var(--sp-3); border:var(--border-w) solid var(--border); border-radius:var(--r-ctl);\r\n         background:var(--bg-elev); font-family:var(--sans); font-size:var(--font-sm); line-height:1.55;\r\n         color:var(--text); transition:border-color var(--dur-fast) var(--ease); }\r\n.ninput::placeholder{ color:var(--text-sub); }\r\n.ninput:hover{ border-color:#C7D0BC; }\r\n.ninput:focus-visible{ outline:2px solid var(--leaf); outline-offset:1px; border-color:var(--leaf); }\r\n/* 폼 한 덩어리 — 설정 화면의 내부 폼과 같은 방식(최대 폭 + 세로 스택) */\r\n.pform{ max-width:640px; display:flex; flex-direction:column; gap:var(--sp-4); }\r\n.pform .actions{ display:flex; gap:var(--sp-3); margin-top:var(--sp-3); }\r\n.pform .hint{ font-family:var(--sans); font-size:var(--font-caption); color:var(--text-sub); }\r\n.nav a:hover{ background:rgba(58,107,33,.10); }\r\n.nav a:active{ background:var(--bg-elev); color:var(--leaf); }\r\n.nav a:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.nav a.active{ background:var(--bg-elev); color:var(--leaf); font-weight:700; text-shadow:var(--ts-heading); }\r\n\r\n/* ── 아르 에이전트 패널: .dpanel 과 동일 규격·동일 메커니즘 ─────────\r\n   body 직속 flex 자식. 열리면 width 0→420px 로 .main(콘텐츠)이 줄어든다(오버레이 아님).\r\n   1100px 이하에선 .dpanel 과 같이 fixed 오버레이로 전환. */\r\n.apanel{ flex:none; width:0; overflow:hidden; position:relative;\r\n         background:var(--bg-elev); border-left:0 solid #DCE3D4;\r\n         transition:width var(--dur-base) var(--ease); }\r\n.apanel.open{ width:420px; border-left-width:var(--border-w); }\r\n.apanel .ainner{ width:420px; height:100%; overflow:hidden;\r\n                 display:flex; flex-direction:column; font-family:var(--sans);\r\n                 transform:translateX(100%); transition:transform var(--dur-base) var(--ease); }\r\n.apanel.open .ainner{ transform:none; }\r\n@media (max-width:1100px){ .apanel .ainner{ transform:none; transition:none; } }\r\n@media (max-width:1100px){\r\n  /* [교정] 인수인계 데모는 z-index:31 이었다. 05-design §8 은 스케일 밖 z-index 직접 지정을 금지한다.\r\n     .dpanel 과 같은 30 을 쓰되 DOM 에서 .dpanel 보다 뒤에 두어 위에 그려지게 했다 — .dclose 때와 같은 방식. */\r\n  .apanel{ position:fixed; top:0; right:0; bottom:0; z-index:30; width:420px;\r\n           border-left-width:var(--border-w); box-shadow:0 8px 28px rgba(27,33,23,.14);\r\n           transform:translateX(100%); transition:transform var(--dur-base) var(--ease); }\r\n  .apanel.open{ transform:none; }\r\n}\r\n.ahead{ flex:none; display:flex; align-items:center; gap:var(--sp-3);\r\n        padding:var(--sp-5) var(--sp-5) var(--sp-4); padding-right:72px; border-bottom:var(--border-w) solid var(--border-soft); }\r\n.ahead .agchar{ width:32px; height:32px; flex:none; }\r\n.ahead .aname{ font-size:var(--font-h2); font-weight:700; color:var(--text); text-shadow:var(--ts-heading); white-space:nowrap; }\r\n.ahead .aclose{ position:absolute; top:var(--sp-4); right:var(--sp-4); z-index:var(--z-sticky);\r\n        width:36px; height:36px; display:flex; align-items:center; justify-content:center;\r\n        cursor:pointer; background:var(--bg-elev); border:var(--border-w) solid #DCE3D4; border-radius:var(--r-ctl);\r\n        transition:background var(--dur-fast) var(--ease); }\r\n.ahead .aclose:hover{ background:#EBF0E5; }\r\n.ahead .aclose:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.ahead .aclose svg{ width:18px; height:18px; stroke:var(--text); fill:none; stroke-width:2; stroke-linecap:round; }\r\n.alog{ flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:var(--sp-4) var(--sp-5);\r\n       display:flex; flex-direction:column; gap:var(--sp-3); }\r\n/* [교정] 말풍선 radius 12px/2px → --r-card. 05-design §4 는 radius 를 8/6/999 세 값으로 확정했다. */\r\n.amsg-user{ align-self:flex-end; max-width:85%; background:var(--bg-sunken); border-radius:var(--r-card);\r\n            padding:var(--sp-2) var(--sp-3); font-size:var(--font-sm); color:var(--text); word-break:keep-all; }\r\n.atool{ font-size:var(--font-caption); color:var(--text-sub); line-height:1.7; }\r\n.arow-ai{ display:flex; gap:var(--sp-2); align-items:flex-start; }\r\n.arow-ai .agchar{ width:26px; height:26px; flex:none; }\r\n/* AI 제안 = 앰버 점선 (05-design §1 불변 규약) */\r\n.acard-ai{ flex:1; min-width:0; background:var(--ai-soft); border:var(--border-w) dashed var(--ai);\r\n           border-radius:var(--r-card); padding:var(--sp-3); font-size:var(--font-sm); color:var(--text); word-break:keep-all; }\r\n.acard-ai .abtns{ margin-top:var(--sp-3); display:flex; gap:var(--sp-2); }\r\n/* [교정] 데모의 padding:6px 18px 은 4px 배수가 아니다(§3). 기존 .btn 과 같은 방식(높이 + --sp 좌우)으로 맞췄다. */\r\n.abtn-ok, .abtn-no{ height:36px; padding:0 var(--sp-4); border-radius:var(--r-ctl); white-space:nowrap;\r\n           font-family:var(--sans); font-size:var(--font-sm); cursor:pointer;\r\n           transition:background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease); }\r\n.abtn-ok:active, .abtn-no:active{ transform:translateY(1px); }\r\n.abtn-ok:focus-visible, .abtn-no:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.abtn-ok{ background:var(--leaf); color:#fff; font-weight:600; text-shadow:var(--ts-onfill); border:var(--border-w) solid transparent; }\r\n.abtn-ok:hover{ background:var(--leaf-strong); }\r\n.abtn-no{ background:var(--bg-elev); color:var(--text-sub); border:var(--border-w) solid #DCE3D4; }\r\n.abtn-no:hover{ background:#EBF0E5; }\r\n/* 사람 확정 결과 = 잎초록 실선. [교정] 데모의 var(--sprout-soft) 는 정의된 적 없는 토큰이라\r\n   폴백값 #EFF7E2 로 굳혔다 — 이 파일에서 이미 쓰는 값이다(새 색 아님). */\r\n.acard-done{ background:#EFF7E2; border:var(--border-w) solid var(--leaf); border-radius:var(--r-card);\r\n             padding:var(--sp-3); font-size:var(--font-sm); color:var(--text); word-break:keep-all; }\r\n.ainput-row{ flex:none; margin:0 var(--sp-5) var(--sp-5); display:flex; align-items:center; gap:var(--sp-2); }\r\n.ainput{ flex:1; min-width:0; display:flex; align-items:center;\r\n         background:var(--bg-sunken); border-radius:var(--r-ctl); padding:var(--sp-2) var(--sp-3); }\r\n.ainput input{ flex:1; min-width:0; border:0; background:transparent; outline:none;\r\n               font-family:var(--sans); font-size:var(--font-sm); color:var(--text); }\r\n.ainput .amic{ flex:none; background:none; border:0; cursor:pointer; display:flex; padding:4px; border-radius:var(--r-ctl);\r\n                transition:background var(--dur-fast) var(--ease); }\r\n.ainput .amic:hover{ background:var(--sunken-hover); }\r\n.ainput .amic:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.ainput .amic.on{ background:var(--ai-soft); outline:var(--border-w) dashed var(--ai); }\r\n.ainput .amic svg{ width:18px; height:18px; stroke:var(--text-sub); fill:none; stroke-width:1.8; }\r\n.asend{ flex:none; width:36px; height:36px; display:flex; align-items:center; justify-content:center;\r\n        background:var(--leaf); border:0; border-radius:var(--r-ctl);\r\n        cursor:pointer; transition:background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease); }\r\n.asend:not(:disabled):hover{ background:var(--leaf-strong); }\r\n.asend:not(:disabled):active{ transform:translateY(1px); }\r\n.asend:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.asend:disabled{ opacity:.35; cursor:not-allowed; }\r\n.asend svg{ width:18px; height:18px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }\r\n.akbd{ flex:none; font-size:var(--font-caption); color:var(--text-sub); white-space:nowrap; }\r\n/* 사이드바 상주 슬롯 — 하단(프로필 위), 전 화면 공통.\r\n   [교정] 데모는 margin/width 때문에 슬롯이 nav 바로 아래에 붙고 좌우도 8px 안쪽으로 밀려 있었다.\r\n   바닥으로 미는 역할을 .me 대신 .agslot 이 맡고, 좌우는 로고·nav·프로필과 같은 기준선을 쓴다. */\r\n.agslot{ margin:auto 0 var(--sp-2); padding:var(--sp-2) var(--sp-3); display:flex; align-items:center; gap:var(--sp-2);\r\n         background:var(--bg-elev); border:var(--border-w) solid var(--sidebar-line);\r\n         border-radius:var(--r-card); cursor:pointer; font-family:var(--sans); text-align:left;\r\n         transition:background var(--dur-fast) var(--ease); }\r\n.sidebar .me{ margin-top:0; }\r\n.agslot:hover{ background:var(--bg-sunken); }\r\n.agslot:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.agslot .agchar{ width:24px; height:24px; flex:none; }\r\n/* [교정] 데모의 13px/11px 은 §2 7단계 스케일 밖이다 → --font-sm / --font-caption. */\r\n.agslot b{ display:block; font-size:var(--font-sm); font-weight:600; color:var(--text); white-space:nowrap; }\r\n.agslot .agdot{ margin-left:auto; width:var(--sp-2); height:var(--sp-2); flex:none; border-radius:50%; background:var(--ai); opacity:0; }\r\n.agslot.pending .agdot{ opacity:1; }\r\n\r\n/* ── 아르 캐릭터 모션 (팀장 확정 레퍼런스 그대로) ────────────────\r\n   원칙: 모든 모션은 트리거(사용자 동작·상태 변화)에 대한 반응. 유휴 = 완전 정지.\r\n   루프는 listen(음성 듣는 중)·think(도구 실행 중) 둘뿐, 나머지는 1회성.\r\n   상태는 .agchar 에 클래스 하나를 토글: enter | listen | think | ask | confirm | fail */\r\n.agchar{ display:block; }\r\n.agchar .agleafL{ transform-origin:12px 8px; }\r\n.agchar .agleafR{ transform-origin:12px 8px; }\r\n.agchar .agbody{ transform-origin:12px 15px; }\r\n.agchar .agnewleaf{ transform-origin:12px 7.5px; transform:scale(0); opacity:0; }\r\n.agchar .agmouth{ transform-origin:12px 17.5px; }\r\n\r\n.agchar.enter .agbody{ animation:ag-pop var(--dur-base) var(--ease); }\r\n.agchar.listen .agleafL{ animation:ag-earL 1.1s ease-in-out infinite; }\r\n.agchar.listen .agleafR{ animation:ag-earR 1.1s ease-in-out infinite; }\r\n.agchar.think .agleafR{ animation:ag-tilt 1.4s ease-in-out infinite; }\r\n.agchar.ask .agbody{ animation:none; }           /* 확인 대기 = 정지가 신호 */\r\n.agchar.confirm .agnewleaf{ animation:ag-grow .6s cubic-bezier(.2,1.4,.4,1) forwards; }\r\n.agchar.confirm .agbody{ animation:ag-hop .5s var(--ease); }\r\n.agchar.fail .agleafL, .agchar.fail .agleafR{ animation:ag-wilt .7s ease-out 2 alternate; }\r\n.agchar.fail .agmouth{ animation:ag-frown .7s ease-out 2 alternate; }\r\n\r\n@keyframes ag-pop{ from{ transform:translateY(10px) scale(.5); opacity:0; } to{ transform:none; opacity:1; } }\r\n@keyframes ag-earL{ 0%,100%{ transform:rotate(0); } 50%{ transform:rotate(-14deg); } }\r\n@keyframes ag-earR{ 0%,100%{ transform:rotate(0); } 50%{ transform:rotate(10deg); } }\r\n@keyframes ag-tilt{ 0%,100%{ transform:rotate(0); } 50%{ transform:rotate(24deg); } }\r\n@keyframes ag-grow{ from{ transform:scale(0) rotate(-30deg); opacity:0; } to{ transform:scale(1) rotate(0); opacity:1; } }\r\n@keyframes ag-hop{ 0%,100%{ transform:translateY(0); } 40%{ transform:translateY(-2px); } }\r\n@keyframes ag-wilt{ to{ transform:rotate(26deg) translateY(1.5px); } }\r\n@keyframes ag-frown{ to{ transform:translateY(1.5px) scaleY(-.7); } }\r\n@media (prefers-reduced-motion: reduce){ .agchar *{ animation:none !important; } }\r\n","body":"\r\n\r\n<aside class=\"sidebar\">\r\n  <div class=\"logo\">Arda</div>\r\n  <nav class=\"nav\">\r\n    <a href=\"mockup-dashboard.html\"><svg viewBox=\"0 0 24 24\"><rect x=\"3.5\" y=\"3.5\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"13.5\" y=\"3.5\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"3.5\" y=\"13.5\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"13.5\" y=\"13.5\" width=\"7\" height=\"7\" rx=\"1.5\"/></svg>대시보드</a>\r\n    <a href=\"mockup-postings.html\" class=\"active\"><svg viewBox=\"0 0 24 24\"><path d=\"M6 3.5h8l4 4v13H6z\"/><path d=\"M14 3.5v4h4\"/><path d=\"M9 12h6M9 15.5h6\"/></svg>채용 공고</a>\r\n    <a href=\"mockup-applicants.html\"><svg viewBox=\"0 0 24 24\"><circle cx=\"9\" cy=\"8\" r=\"3.2\"/><path d=\"M3.8 19.5c0-2.9 2.3-5.2 5.2-5.2s5.2 2.3 5.2 5.2\"/><circle cx=\"16.8\" cy=\"9\" r=\"2.4\"/><path d=\"M15.6 14.6c2.6.4 4.6 2.4 4.6 4.9\"/></svg>지원자</a>\r\n    <a href=\"mockup-interviews.html\"><svg viewBox=\"0 0 24 24\"><rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15.5\" rx=\"2\"/><path d=\"M3.5 9.5h17M8 3.5v3M16 3.5v3\"/></svg>면접 일정</a>\r\n    <a href=\"mockup-evaluations.html\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 3.8l2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.5-.8z\"/></svg>평가 현황</a>\r\n    <a href=\"mockup-settings.html\"><svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"3.2\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z\"/></svg>설정</a>\r\n  </nav>\r\n  <button type=\"button\" class=\"agslot\" id=\"agSlot\" aria-label=\"아르 에이전트 열기 (Ctrl+K)\"><svg class=\"agchar\" viewBox=\"0 0 24 24\" role=\"img\" aria-hidden=\"true\">\r\n  <g class=\"agbody\">\r\n    <circle cx=\"12\" cy=\"15\" r=\"7\" fill=\"#8CC63F\"/>\r\n    <path class=\"agleafL\" d=\"M12 8 C 12 4, 8 3, 6 4 C 7 7, 10 8, 12 8\" fill=\"#3A6B21\"/>\r\n    <path class=\"agleafR\" d=\"M12 8 C 12 5, 16 3.5, 18 4.5 C 17 7.5, 13 8, 12 8\" fill=\"#8CC63F\"/>\r\n    <path class=\"agnewleaf\" d=\"M12 7.5 C 11 5, 12.5 2.5, 14.5 2 C 15 4.5, 13.5 6.5, 12 7.5\" fill=\"#8CC63F\"/>\r\n    <circle class=\"ageye\" cx=\"9.5\" cy=\"14.5\" r=\"1\" fill=\"#1B2117\"/>\r\n    <circle class=\"ageye\" cx=\"14.5\" cy=\"14.5\" r=\"1\" fill=\"#1B2117\"/>\r\n    <path class=\"agmouth\" d=\"M10 17.5 q2 1.5 4 0\" stroke=\"#1B2117\" stroke-width=\"1\" fill=\"none\" stroke-linecap=\"round\"/>\r\n  </g>\r\n</svg><span><b>아르</b></span><span class=\"agdot\"></span></button>\r\n<div class=\"me\">\r\n    <div>\r\n      <div class=\"name\">김채용</div>\r\n      <div class=\"role\">채용담당자</div>\r\n    </div>\r\n    <div class=\"avatar\">김</div>\r\n  </div>\r\n</aside>\r\n\r\n<div class=\"main\">\r\n  <header class=\"head\">\r\n    <div class=\"head-top\">\r\n      <button class=\"back\" id=\"back\" aria-label=\"채용 공고 목록으로\"><svg viewBox=\"0 0 24 24\"><path d=\"M19 12H5M11 6l-6 6 6 6\"/></svg></button>\r\n      <h1 class=\"title\">공고 등록</h1>\r\n    </div>\r\n  </header>\r\n  <main class=\"content\">\r\n    <form class=\"pform\" id=\"pform\" novalidate>\r\n      <div class=\"tfield\">\r\n        <label for=\"p-title\">공고 제목</label>\r\n        <input class=\"tinput\" id=\"p-title\" type=\"text\" maxlength=\"200\" placeholder=\"예: 백엔드 개발자 (신입)\">\r\n      </div>\r\n      <div class=\"tfield\">\r\n        <label for=\"p-desc\">공고 본문</label>\r\n        <textarea class=\"ninput\" id=\"p-desc\" rows=\"8\" placeholder=\"담당 업무, 자격 요건, 우대 사항을 적습니다\"></textarea>\r\n      </div>\r\n      <div class=\"tfield\">\r\n        <label for=\"p-status\">상태</label>\r\n        <select class=\"tinput\" id=\"p-status\">\r\n          <option value=\"draft\">임시 저장</option>\r\n          <option value=\"open\" selected>진행중</option>\r\n          <option value=\"closed\">마감</option>\r\n        </select>\r\n      </div>\r\n      <p class=\"hint\">마감일은 스키마 확정 항목이 아니라 이 폼에 넣지 않았습니다 (01-erd job_postings 비고 — B4 추가 여지).</p>\r\n      <div class=\"actions\">\r\n        <button class=\"btn btn-primary\" id=\"submit\" type=\"submit\" disabled>등록</button>\r\n        <button class=\"btn\" id=\"cancel\" type=\"button\" style=\"background:var(--bg-elev); border-color:var(--border); color:var(--text);\">취소</button>\r\n      </div>\r\n    </form>\r\n  </main>\r\n</div>\r\n\r\n\r\n\r\n<aside class=\"apanel\" id=\"apanel\" aria-label=\"아르 에이전트\">\r\n  <div class=\"ainner\">\r\n    <div class=\"ahead\">\r\n      <svg class=\"agchar\" id=\"agCharMain\" viewBox=\"0 0 24 24\" role=\"img\" aria-hidden=\"true\">\r\n  <g class=\"agbody\">\r\n    <circle cx=\"12\" cy=\"15\" r=\"7\" fill=\"#8CC63F\"/>\r\n    <path class=\"agleafL\" d=\"M12 8 C 12 4, 8 3, 6 4 C 7 7, 10 8, 12 8\" fill=\"#3A6B21\"/>\r\n    <path class=\"agleafR\" d=\"M12 8 C 12 5, 16 3.5, 18 4.5 C 17 7.5, 13 8, 12 8\" fill=\"#8CC63F\"/>\r\n    <path class=\"agnewleaf\" d=\"M12 7.5 C 11 5, 12.5 2.5, 14.5 2 C 15 4.5, 13.5 6.5, 12 7.5\" fill=\"#8CC63F\"/>\r\n    <circle class=\"ageye\" cx=\"9.5\" cy=\"14.5\" r=\"1\" fill=\"#1B2117\"/>\r\n    <circle class=\"ageye\" cx=\"14.5\" cy=\"14.5\" r=\"1\" fill=\"#1B2117\"/>\r\n    <path class=\"agmouth\" d=\"M10 17.5 q2 1.5 4 0\" stroke=\"#1B2117\" stroke-width=\"1\" fill=\"none\" stroke-linecap=\"round\"/>\r\n  </g>\r\n</svg>\r\n      <div><div class=\"aname\">아르</div></div>\r\n      <button class=\"aclose\" id=\"aclose\" aria-label=\"에이전트 닫기\"><svg viewBox=\"0 0 24 24\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg></button>\r\n    </div>\r\n    <div class=\"alog\" id=\"alog\" role=\"log\" aria-live=\"polite\"></div>\r\n    <div class=\"ainput-row\">\r\n      <div class=\"ainput\">\r\n        <input id=\"ainputEl\" placeholder=\"채용 업무를 맡겨보세요\" aria-label=\"에이전트 명령 입력\">\r\n        <button type=\"button\" class=\"amic\" id=\"amic\" aria-label=\"음성 입력\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"/><path d=\"M5 11a7 7 0 0 0 14 0M12 18v3\"/></svg></button>\r\n      </div>\r\n      <button type=\"button\" class=\"asend\" id=\"asend\" aria-label=\"전송\" disabled><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/><polyline points=\"13 6 19 12 13 18\"/></svg></button>\r\n    </div>\r\n  </div>\r\n</aside>\r\n\r\n\r\n","js":"\r\nvar title=document.getElementById('p-title'), submit=document.getElementById('submit');\r\nfunction toggle(){ submit.disabled = title.value.trim()===''; }\r\ntitle.addEventListener('input', toggle);\r\ndocument.getElementById('back').addEventListener('click',function(){ location.href='mockup-postings.html'; });\r\ndocument.getElementById('cancel').addEventListener('click',function(){ location.href='mockup-postings.html'; });\r\ndocument.getElementById('pform').addEventListener('submit',function(e){ e.preventDefault(); });\r\n\n\r\n/* ── 아르 에이전트 배선 (인수인계 데모와 동일 흐름) ────────────────\r\n   캐릭터 상태: setChar('enter'|'listen'|'think'|'ask'|'confirm'|'fail'|'')\r\n   쓰기 도구는 반드시 앰버 확인 카드 → [확인] 을 거친다 (ADR-0003). */\r\n(function(){\r\nvar ap=document.getElementById('apanel'), slot=document.getElementById('agSlot');\r\nvar log=document.getElementById('alog'), input=document.getElementById('ainputEl');\r\nvar mic=document.getElementById('amic');\r\nvar send=document.getElementById('asend');\r\nvar chars=[document.getElementById('agCharMain'), slot.querySelector('.agchar')];\r\nfunction setChar(s){ chars.forEach(function(c){ if(!c) return;\r\n  c.classList.remove('enter','listen','think','ask','confirm','fail');\r\n  void c.getBoundingClientRect(); if(s) c.classList.add(s); }); }\r\nfunction openAg(){ ap.classList.add('open'); localStorage.setItem('arda-open','1'); slot.classList.remove('pending');\r\n  var _dp=document.getElementById('dpanel'); if(_dp) _dp.classList.remove('open');\r\n  setChar('enter'); setTimeout(function(){ setChar(''); }, 500);\r\n  setTimeout(function(){ input.focus(); }, 300); }\r\nfunction closeAg(){ ap.classList.remove('open'); localStorage.removeItem('arda-open'); setChar(''); mic.classList.remove('on');\r\n  input.placeholder='채용 업무를 맡겨보세요'; }\r\nslot.addEventListener('click', function(){ ap.classList.contains('open')?closeAg():openAg(); });\r\ndocument.getElementById('aclose').addEventListener('click', closeAg);\r\ndocument.addEventListener('keydown', function(e){\r\n  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openAg(); }\r\n  /* Esc 는 상세 패널도 쓴다. 에이전트가 열려 있을 때만 삼키고, 아니면 원래 핸들러에 넘긴다. */\r\n  if(e.key==='Escape' && ap.classList.contains('open')){ e.stopPropagation(); closeAg(); }\r\n}, true);\r\nmic.addEventListener('click', function(){\r\n  var on=mic.classList.toggle('on'); setChar(on?'listen':'');\r\n  input.placeholder = on ? '듣고 있어요…' : '채용 업무를 맡겨보세요';\r\n});\r\nfunction el(cls, html){ var d=document.createElement('div'); d.className=cls; d.innerHTML=html; return d; }\r\nfunction scrollEnd(){ log.scrollTop=log.scrollHeight; }\r\nvar CHAR_SM='<svg class=\"agchar\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">'+document.getElementById('agCharMain').innerHTML+'<\\/svg>';\r\ninput.addEventListener('input', function(){ if(send) send.disabled=!input.value.trim(); });\r\nif(send) send.addEventListener('click', function(){ input.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true})); });\r\ninput.addEventListener('keydown', function(e){\r\n  if(e.key!=='Enter' || !input.value.trim()) return;\r\n  var q=input.value.trim(); input.value=''; mic.classList.remove('on'); if(send) send.disabled=true;\r\n  log.appendChild(el('amsg-user', q)); scrollEnd();\r\n  setChar('think');\r\n  setTimeout(function(){\r\n    log.appendChild(el('atool', '✓ 검색: 기술 Python · 경력 2년 이상<br>✓ 결과 3명 — 박서연 · 이준호 · 최유진')); scrollEnd();\r\n  }, 700);\r\n  setTimeout(function(){\r\n    setChar('ask'); slot.classList.add('pending');\r\n    var row=el('arow-ai', CHAR_SM+\r\n      '<div class=\"acard-ai\">3명을 <b>서류 검토 → 면접</b> 단계로 옮길까요?'+\r\n      '<div class=\"abtns\"><button type=\"button\" class=\"abtn-ok\">확인</button>'+\r\n      '<button type=\"button\" class=\"abtn-no\">취소</button></div></div>');\r\n    row.querySelector('.abtn-ok').addEventListener('click', function(){\r\n      row.querySelector('.abtns').remove(); slot.classList.remove('pending');\r\n      setChar('confirm');\r\n      log.appendChild(el('acard-done', '✓ 3명을 면접 단계로 옮겼어요. 단계 이력에 기록됐습니다.')); scrollEnd();\r\n      setTimeout(function(){ setChar(''); }, 900);\r\n    });\r\n    row.querySelector('.abtn-no').addEventListener('click', function(){\r\n      row.querySelector('.abtns').remove(); slot.classList.remove('pending');\r\n      setChar('fail');\r\n      log.appendChild(el('atool', '취소했어요. 변경 없음.')); scrollEnd();\r\n      setTimeout(function(){ setChar(''); }, 1200);\r\n    });\r\n    log.appendChild(row); scrollEnd();\r\n  }, 1500);\r\n});\r\nif(localStorage.getItem('arda-open')==='1') ap.classList.add('open');\r\n})();\r\n"},
  "mockup-applicant-new.html": {"css":"\r\n:root{\r\n  --bg:#F4F7F0;\r\n  --sidebar-bg:#C7E49B;    /* 연두: 확실히 초록으로 읽히되 어둡지 않은 중간 톤 */\r\n  --sidebar-line:#A8CD6E;  /* 사이드바 오른쪽 경계선: 배경보다 한 단계 진한 연두 1px */\r\n  --border-w:1px;\r\n  --sidebar-w:216px;\r\n  --content-x:48px;\r\n  --text:#1B2117;\r\n  --text-sub:#5C6654;\r\n  --leaf:#3A6B21;\r\n  --leaf-strong:#2C5218;\r\n  --danger:#A9503C;\r\n  --ai:#A9702A;            /* AI 제안 — 앰버 점선 규약 (05-design 확정) */\r\n  --ai-soft:#FBF2E5;       /* AI 제안 워시 */\r\n  --sans:\"IBM Plex Sans KR\",system-ui,\"Malgun Gothic\",sans-serif;\r\n  --font-num:14px;\r\n  --font-display:26px; --font-h1:22px; --font-h2:18px; --font-body:16px; --font-sm:14px; --font-caption:12px;\r\n  --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:40px; --sp-8:48px;\r\n  --r-ctl:6px; --r-card:8px;\r\n  --bg-elev:#FFFFFF;\r\n  --border:#DCE3D4;\r\n  --border-soft:#EAEFE4;\r\n  --bg-sunken:#EBF0E5;     /* 인풋·트랙: 패널보다 한 단계 아래 */\r\n  --sunken-hover:#DCE3D4;  /* sunken 바탕 위 hover 채움: 한 톤 진하게 */\r\n  --ts-heading:0 1px 0 rgba(27,33,23,.34);\r\n  --ts-onfill:0 1px 0 rgba(0,0,0,.62);\r\n  --z-sticky:10;\r\n  --dur-fast:120ms; --dur-base:200ms; --ease:cubic-bezier(.2,0,0,1);\r\n}\r\n@media (prefers-reduced-motion: reduce){ *{ transition-duration:0ms !important; } }\r\n*{ box-sizing:border-box; margin:0; }\r\nbody{ background:var(--bg); height:100vh; display:flex; overflow:hidden; }\r\n.sidebar{ width:var(--sidebar-w); flex:none; background:var(--sidebar-bg);\r\n          border-right:var(--border-w) solid var(--sidebar-line);\r\n          padding:var(--sp-4) var(--sp-2) 0; }\r\n.logo{ font-family:var(--sans); font-size:var(--font-h1); font-weight:700; letter-spacing:-.01em;\r\n       color:var(--text); text-shadow:var(--ts-heading); white-space:nowrap; padding:0 var(--sp-3); }\r\n.logo .seed{ color:var(--leaf); }\r\n.nav{ margin-top:var(--sp-6); display:flex; flex-direction:column; gap:2px; font-family:var(--sans); }\r\n.nav a{ display:flex; align-items:center; gap:var(--sp-3); min-height:48px; color:var(--text); text-decoration:none;\r\n        font-size:var(--font-body); font-weight:500;\r\n        padding:0 var(--sp-3); border-radius:var(--r-ctl); white-space:nowrap;\r\n        transition:background var(--dur-fast) var(--ease); }\r\n.nav a svg{ width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8;\r\n            stroke-linecap:round; stroke-linejoin:round; }\r\n.me{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:var(--sp-2);\r\n     padding:var(--sp-3); border-top:var(--border-w) solid var(--sidebar-line);\r\n     font-family:var(--sans); white-space:nowrap; }\r\n.me .name{ font-size:var(--font-body); font-weight:600; color:var(--text); }\r\n.me .role{ font-size:var(--font-sm); color:var(--leaf); margin-top:2px; }\r\n.me .avatar{ width:44px; height:44px; flex:none; border-radius:50%; background:var(--bg-elev);\r\n             border:var(--border-w) solid var(--sidebar-line);\r\n             display:flex; align-items:center; justify-content:center;\r\n             font-size:var(--font-h2, 18px); font-weight:700; color:var(--leaf); }\r\n.sidebar{ display:flex; flex-direction:column; }\r\n.main{ flex:1; min-width:0; display:flex; flex-direction:column; }\r\n.head{ flex:none; min-height:96px; background:var(--bg-elev);\r\n       border-bottom:var(--border-w) solid #DCE3D4;\r\n       padding:var(--sp-4) var(--content-x);\r\n       display:flex; flex-direction:column; justify-content:center; }\r\n.head .title{ font-family:var(--sans); font-size:var(--font-display); font-weight:700; letter-spacing:-.01em;\r\n              color:var(--text); text-shadow:var(--ts-heading); white-space:nowrap;\r\n              overflow:hidden; text-overflow:ellipsis; }\r\n.head-top{ display:flex; align-items:center; gap:var(--sp-3); min-width:0; }\r\n.head-top .title{ line-height:1.2; }\r\n.head-meta{ font-family:var(--sans); font-size:var(--font-num); font-variant-numeric:tabular-nums;\r\n            color:var(--text-sub); white-space:nowrap; flex:none; }\r\n.back{ width:36px; height:36px; flex:none; display:flex; align-items:center; justify-content:center;\r\n       background:var(--bg-elev); border:var(--border-w) solid #DCE3D4; border-radius:var(--r-ctl);\r\n       cursor:pointer; transition:background var(--dur-fast) var(--ease); }\r\n.back:hover{ background:#EBF0E5; }\r\n.back:active{ background:#DCE3D4; }\r\n.back:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.back svg{ width:20px; height:20px; stroke:var(--text); fill:none; stroke-width:2;\r\n           stroke-linecap:round; stroke-linejoin:round; }\r\n.content{ flex:1; min-height:0; overflow-y:auto; padding:var(--sp-5) var(--content-x); }\r\n.btn{ font-family:var(--sans); font-size:var(--font-sm); font-weight:600; white-space:nowrap;\r\n      height:40px; padding:0 var(--sp-4); border-radius:var(--r-ctl); border:var(--border-w) solid transparent;\r\n      cursor:pointer; transition:background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease); }\r\n.btn:active{ transform:translateY(1px); }\r\n.btn:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.btn-primary{ background:var(--leaf); color:#fff; text-shadow:var(--ts-onfill); }\r\n.btn-primary:hover{ background:#2C5218; }\r\n.btn-primary:disabled{ background:#C7D0BC; color:var(--text-sub); text-shadow:none; cursor:not-allowed; }\r\n.tfield{ display:flex; flex-direction:column; gap:var(--sp-2); }\r\n.tfield label{ font-family:var(--sans); font-size:var(--font-sm); font-weight:600; color:var(--text); }\r\n.tinput{ width:100%; height:40px; padding:0 var(--sp-3);\r\n         border:var(--border-w) solid var(--border); border-radius:var(--r-ctl);\r\n         background:var(--bg-elev); font-family:var(--sans); font-size:var(--font-body); color:var(--text);\r\n         transition:border-color var(--dur-fast) var(--ease); }\r\n.tinput::placeholder{ color:var(--text-sub); }\r\n.tinput:hover{ border-color:var(--sunken-hover); }\r\n.tinput:focus-visible{ outline:2px solid var(--leaf); outline-offset:1px; border-color:var(--leaf); }\r\n.tinput:disabled{ background:var(--bg-sunken); color:var(--text-sub); cursor:not-allowed; }\r\n.ninput{ display:block; width:100%; min-height:76px; resize:vertical; margin-bottom:var(--sp-2);\r\n         padding:var(--sp-3); border:var(--border-w) solid var(--border); border-radius:var(--r-ctl);\r\n         background:var(--bg-elev); font-family:var(--sans); font-size:var(--font-sm); line-height:1.55;\r\n         color:var(--text); transition:border-color var(--dur-fast) var(--ease); }\r\n.ninput::placeholder{ color:var(--text-sub); }\r\n.ninput:hover{ border-color:#C7D0BC; }\r\n.ninput:focus-visible{ outline:2px solid var(--leaf); outline-offset:1px; border-color:var(--leaf); }\r\n.upload{ display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3);\r\n         background:var(--bg-sunken); border-radius:var(--r-card); font-family:var(--sans); }\r\n.upload .ufile{ flex:1; min-width:0; font-size:var(--font-sm); color:var(--text);\r\n                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }\r\n.upload .ufile.empty{ color:var(--text-sub); }\r\n.upload .ubtn{ flex:none; height:32px; padding:0 var(--sp-3); border-radius:var(--r-ctl);\r\n               background:var(--bg-elev); border:var(--border-w) solid var(--border);\r\n               font-family:var(--sans); font-size:var(--font-sm); font-weight:600; color:var(--text);\r\n               white-space:nowrap; cursor:pointer; text-shadow:var(--ts-heading);\r\n               transition:background var(--dur-fast) var(--ease); }\r\n.upload .ubtn:hover{ background:var(--bg-sunken); }\r\n.upload .ubtn:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.upload-field{ display:flex; flex-direction:column; gap:var(--sp-2); }\r\n.upload-field label{ font-family:var(--sans); font-size:var(--font-sm); font-weight:600; color:var(--text); }\r\n.filehint{ font-family:var(--sans); font-size:var(--font-caption); color:var(--text-sub); }\r\n/* 폼 한 덩어리 — 공고 등록 화면과 같은 방식 */\r\n.pform{ max-width:640px; display:flex; flex-direction:column; gap:var(--sp-4); }\r\n.pform .actions{ display:flex; gap:var(--sp-3); margin-top:var(--sp-3); }\r\n.pform .hint{ font-family:var(--sans); font-size:var(--font-caption); color:var(--text-sub); }\r\n.pform .req{ color:var(--danger); }\r\n.nav a:hover{ background:rgba(58,107,33,.10); }\r\n.nav a:active{ background:var(--bg-elev); color:var(--leaf); }\r\n.nav a:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.nav a.active{ background:var(--bg-elev); color:var(--leaf); font-weight:700; text-shadow:var(--ts-heading); }\r\n\r\n/* ── 아르 에이전트 패널: .dpanel 과 동일 규격·동일 메커니즘 ─────────\r\n   body 직속 flex 자식. 열리면 width 0→420px 로 .main(콘텐츠)이 줄어든다(오버레이 아님).\r\n   1100px 이하에선 .dpanel 과 같이 fixed 오버레이로 전환. */\r\n.apanel{ flex:none; width:0; overflow:hidden; position:relative;\r\n         background:var(--bg-elev); border-left:0 solid #DCE3D4;\r\n         transition:width var(--dur-base) var(--ease); }\r\n.apanel.open{ width:420px; border-left-width:var(--border-w); }\r\n.apanel .ainner{ width:420px; height:100%; overflow:hidden;\r\n                 display:flex; flex-direction:column; font-family:var(--sans);\r\n                 transform:translateX(100%); transition:transform var(--dur-base) var(--ease); }\r\n.apanel.open .ainner{ transform:none; }\r\n@media (max-width:1100px){ .apanel .ainner{ transform:none; transition:none; } }\r\n@media (max-width:1100px){\r\n  /* [교정] 인수인계 데모는 z-index:31 이었다. 05-design §8 은 스케일 밖 z-index 직접 지정을 금지한다.\r\n     .dpanel 과 같은 30 을 쓰되 DOM 에서 .dpanel 보다 뒤에 두어 위에 그려지게 했다 — .dclose 때와 같은 방식. */\r\n  .apanel{ position:fixed; top:0; right:0; bottom:0; z-index:30; width:420px;\r\n           border-left-width:var(--border-w); box-shadow:0 8px 28px rgba(27,33,23,.14);\r\n           transform:translateX(100%); transition:transform var(--dur-base) var(--ease); }\r\n  .apanel.open{ transform:none; }\r\n}\r\n.ahead{ flex:none; display:flex; align-items:center; gap:var(--sp-3);\r\n        padding:var(--sp-5) var(--sp-5) var(--sp-4); padding-right:72px; border-bottom:var(--border-w) solid var(--border-soft); }\r\n.ahead .agchar{ width:32px; height:32px; flex:none; }\r\n.ahead .aname{ font-size:var(--font-h2); font-weight:700; color:var(--text); text-shadow:var(--ts-heading); white-space:nowrap; }\r\n.ahead .aclose{ position:absolute; top:var(--sp-4); right:var(--sp-4); z-index:var(--z-sticky);\r\n        width:36px; height:36px; display:flex; align-items:center; justify-content:center;\r\n        cursor:pointer; background:var(--bg-elev); border:var(--border-w) solid #DCE3D4; border-radius:var(--r-ctl);\r\n        transition:background var(--dur-fast) var(--ease); }\r\n.ahead .aclose:hover{ background:#EBF0E5; }\r\n.ahead .aclose:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.ahead .aclose svg{ width:18px; height:18px; stroke:var(--text); fill:none; stroke-width:2; stroke-linecap:round; }\r\n.alog{ flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:var(--sp-4) var(--sp-5);\r\n       display:flex; flex-direction:column; gap:var(--sp-3); }\r\n/* [교정] 말풍선 radius 12px/2px → --r-card. 05-design §4 는 radius 를 8/6/999 세 값으로 확정했다. */\r\n.amsg-user{ align-self:flex-end; max-width:85%; background:var(--bg-sunken); border-radius:var(--r-card);\r\n            padding:var(--sp-2) var(--sp-3); font-size:var(--font-sm); color:var(--text); word-break:keep-all; }\r\n.atool{ font-size:var(--font-caption); color:var(--text-sub); line-height:1.7; }\r\n.arow-ai{ display:flex; gap:var(--sp-2); align-items:flex-start; }\r\n.arow-ai .agchar{ width:26px; height:26px; flex:none; }\r\n/* AI 제안 = 앰버 점선 (05-design §1 불변 규약) */\r\n.acard-ai{ flex:1; min-width:0; background:var(--ai-soft); border:var(--border-w) dashed var(--ai);\r\n           border-radius:var(--r-card); padding:var(--sp-3); font-size:var(--font-sm); color:var(--text); word-break:keep-all; }\r\n.acard-ai .abtns{ margin-top:var(--sp-3); display:flex; gap:var(--sp-2); }\r\n/* [교정] 데모의 padding:6px 18px 은 4px 배수가 아니다(§3). 기존 .btn 과 같은 방식(높이 + --sp 좌우)으로 맞췄다. */\r\n.abtn-ok, .abtn-no{ height:36px; padding:0 var(--sp-4); border-radius:var(--r-ctl); white-space:nowrap;\r\n           font-family:var(--sans); font-size:var(--font-sm); cursor:pointer;\r\n           transition:background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease); }\r\n.abtn-ok:active, .abtn-no:active{ transform:translateY(1px); }\r\n.abtn-ok:focus-visible, .abtn-no:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.abtn-ok{ background:var(--leaf); color:#fff; font-weight:600; text-shadow:var(--ts-onfill); border:var(--border-w) solid transparent; }\r\n.abtn-ok:hover{ background:var(--leaf-strong); }\r\n.abtn-no{ background:var(--bg-elev); color:var(--text-sub); border:var(--border-w) solid #DCE3D4; }\r\n.abtn-no:hover{ background:#EBF0E5; }\r\n/* 사람 확정 결과 = 잎초록 실선. [교정] 데모의 var(--sprout-soft) 는 정의된 적 없는 토큰이라\r\n   폴백값 #EFF7E2 로 굳혔다 — 이 파일에서 이미 쓰는 값이다(새 색 아님). */\r\n.acard-done{ background:#EFF7E2; border:var(--border-w) solid var(--leaf); border-radius:var(--r-card);\r\n             padding:var(--sp-3); font-size:var(--font-sm); color:var(--text); word-break:keep-all; }\r\n.ainput-row{ flex:none; margin:0 var(--sp-5) var(--sp-5); display:flex; align-items:center; gap:var(--sp-2); }\r\n.ainput{ flex:1; min-width:0; display:flex; align-items:center;\r\n         background:var(--bg-sunken); border-radius:var(--r-ctl); padding:var(--sp-2) var(--sp-3); }\r\n.ainput input{ flex:1; min-width:0; border:0; background:transparent; outline:none;\r\n               font-family:var(--sans); font-size:var(--font-sm); color:var(--text); }\r\n.ainput .amic{ flex:none; background:none; border:0; cursor:pointer; display:flex; padding:4px; border-radius:var(--r-ctl);\r\n                transition:background var(--dur-fast) var(--ease); }\r\n.ainput .amic:hover{ background:var(--sunken-hover); }\r\n.ainput .amic:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.ainput .amic.on{ background:var(--ai-soft); outline:var(--border-w) dashed var(--ai); }\r\n.ainput .amic svg{ width:18px; height:18px; stroke:var(--text-sub); fill:none; stroke-width:1.8; }\r\n.asend{ flex:none; width:36px; height:36px; display:flex; align-items:center; justify-content:center;\r\n        background:var(--leaf); border:0; border-radius:var(--r-ctl);\r\n        cursor:pointer; transition:background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease); }\r\n.asend:not(:disabled):hover{ background:var(--leaf-strong); }\r\n.asend:not(:disabled):active{ transform:translateY(1px); }\r\n.asend:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.asend:disabled{ opacity:.35; cursor:not-allowed; }\r\n.asend svg{ width:18px; height:18px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }\r\n.akbd{ flex:none; font-size:var(--font-caption); color:var(--text-sub); white-space:nowrap; }\r\n/* 사이드바 상주 슬롯 — 하단(프로필 위), 전 화면 공통.\r\n   [교정] 데모는 margin/width 때문에 슬롯이 nav 바로 아래에 붙고 좌우도 8px 안쪽으로 밀려 있었다.\r\n   바닥으로 미는 역할을 .me 대신 .agslot 이 맡고, 좌우는 로고·nav·프로필과 같은 기준선을 쓴다. */\r\n.agslot{ margin:auto 0 var(--sp-2); padding:var(--sp-2) var(--sp-3); display:flex; align-items:center; gap:var(--sp-2);\r\n         background:var(--bg-elev); border:var(--border-w) solid var(--sidebar-line);\r\n         border-radius:var(--r-card); cursor:pointer; font-family:var(--sans); text-align:left;\r\n         transition:background var(--dur-fast) var(--ease); }\r\n.sidebar .me{ margin-top:0; }\r\n.agslot:hover{ background:var(--bg-sunken); }\r\n.agslot:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.agslot .agchar{ width:24px; height:24px; flex:none; }\r\n/* [교정] 데모의 13px/11px 은 §2 7단계 스케일 밖이다 → --font-sm / --font-caption. */\r\n.agslot b{ display:block; font-size:var(--font-sm); font-weight:600; color:var(--text); white-space:nowrap; }\r\n.agslot .agdot{ margin-left:auto; width:var(--sp-2); height:var(--sp-2); flex:none; border-radius:50%; background:var(--ai); opacity:0; }\r\n.agslot.pending .agdot{ opacity:1; }\r\n\r\n/* ── 아르 캐릭터 모션 (팀장 확정 레퍼런스 그대로) ────────────────\r\n   원칙: 모든 모션은 트리거(사용자 동작·상태 변화)에 대한 반응. 유휴 = 완전 정지.\r\n   루프는 listen(음성 듣는 중)·think(도구 실행 중) 둘뿐, 나머지는 1회성.\r\n   상태는 .agchar 에 클래스 하나를 토글: enter | listen | think | ask | confirm | fail */\r\n.agchar{ display:block; }\r\n.agchar .agleafL{ transform-origin:12px 8px; }\r\n.agchar .agleafR{ transform-origin:12px 8px; }\r\n.agchar .agbody{ transform-origin:12px 15px; }\r\n.agchar .agnewleaf{ transform-origin:12px 7.5px; transform:scale(0); opacity:0; }\r\n.agchar .agmouth{ transform-origin:12px 17.5px; }\r\n\r\n.agchar.enter .agbody{ animation:ag-pop var(--dur-base) var(--ease); }\r\n.agchar.listen .agleafL{ animation:ag-earL 1.1s ease-in-out infinite; }\r\n.agchar.listen .agleafR{ animation:ag-earR 1.1s ease-in-out infinite; }\r\n.agchar.think .agleafR{ animation:ag-tilt 1.4s ease-in-out infinite; }\r\n.agchar.ask .agbody{ animation:none; }           /* 확인 대기 = 정지가 신호 */\r\n.agchar.confirm .agnewleaf{ animation:ag-grow .6s cubic-bezier(.2,1.4,.4,1) forwards; }\r\n.agchar.confirm .agbody{ animation:ag-hop .5s var(--ease); }\r\n.agchar.fail .agleafL, .agchar.fail .agleafR{ animation:ag-wilt .7s ease-out 2 alternate; }\r\n.agchar.fail .agmouth{ animation:ag-frown .7s ease-out 2 alternate; }\r\n\r\n@keyframes ag-pop{ from{ transform:translateY(10px) scale(.5); opacity:0; } to{ transform:none; opacity:1; } }\r\n@keyframes ag-earL{ 0%,100%{ transform:rotate(0); } 50%{ transform:rotate(-14deg); } }\r\n@keyframes ag-earR{ 0%,100%{ transform:rotate(0); } 50%{ transform:rotate(10deg); } }\r\n@keyframes ag-tilt{ 0%,100%{ transform:rotate(0); } 50%{ transform:rotate(24deg); } }\r\n@keyframes ag-grow{ from{ transform:scale(0) rotate(-30deg); opacity:0; } to{ transform:scale(1) rotate(0); opacity:1; } }\r\n@keyframes ag-hop{ 0%,100%{ transform:translateY(0); } 40%{ transform:translateY(-2px); } }\r\n@keyframes ag-wilt{ to{ transform:rotate(26deg) translateY(1.5px); } }\r\n@keyframes ag-frown{ to{ transform:translateY(1.5px) scaleY(-.7); } }\r\n@media (prefers-reduced-motion: reduce){ .agchar *{ animation:none !important; } }\r\n","body":"\r\n\r\n<aside class=\"sidebar\">\r\n  <div class=\"logo\">Arda</div>\r\n  <nav class=\"nav\">\r\n    <a href=\"mockup-dashboard.html\"><svg viewBox=\"0 0 24 24\"><rect x=\"3.5\" y=\"3.5\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"13.5\" y=\"3.5\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"3.5\" y=\"13.5\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"13.5\" y=\"13.5\" width=\"7\" height=\"7\" rx=\"1.5\"/></svg>대시보드</a>\r\n    <a href=\"mockup-postings.html\" class=\"active\"><svg viewBox=\"0 0 24 24\"><path d=\"M6 3.5h8l4 4v13H6z\"/><path d=\"M14 3.5v4h4\"/><path d=\"M9 12h6M9 15.5h6\"/></svg>채용 공고</a>\r\n    <a href=\"mockup-applicants.html\"><svg viewBox=\"0 0 24 24\"><circle cx=\"9\" cy=\"8\" r=\"3.2\"/><path d=\"M3.8 19.5c0-2.9 2.3-5.2 5.2-5.2s5.2 2.3 5.2 5.2\"/><circle cx=\"16.8\" cy=\"9\" r=\"2.4\"/><path d=\"M15.6 14.6c2.6.4 4.6 2.4 4.6 4.9\"/></svg>지원자</a>\r\n    <a href=\"mockup-interviews.html\"><svg viewBox=\"0 0 24 24\"><rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15.5\" rx=\"2\"/><path d=\"M3.5 9.5h17M8 3.5v3M16 3.5v3\"/></svg>면접 일정</a>\r\n    <a href=\"mockup-evaluations.html\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 3.8l2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.5-.8z\"/></svg>평가 현황</a>\r\n    <a href=\"mockup-settings.html\"><svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"3.2\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z\"/></svg>설정</a>\r\n  </nav>\r\n  <button type=\"button\" class=\"agslot\" id=\"agSlot\" aria-label=\"아르 에이전트 열기 (Ctrl+K)\"><svg class=\"agchar\" viewBox=\"0 0 24 24\" role=\"img\" aria-hidden=\"true\">\r\n  <g class=\"agbody\">\r\n    <circle cx=\"12\" cy=\"15\" r=\"7\" fill=\"#8CC63F\"/>\r\n    <path class=\"agleafL\" d=\"M12 8 C 12 4, 8 3, 6 4 C 7 7, 10 8, 12 8\" fill=\"#3A6B21\"/>\r\n    <path class=\"agleafR\" d=\"M12 8 C 12 5, 16 3.5, 18 4.5 C 17 7.5, 13 8, 12 8\" fill=\"#8CC63F\"/>\r\n    <path class=\"agnewleaf\" d=\"M12 7.5 C 11 5, 12.5 2.5, 14.5 2 C 15 4.5, 13.5 6.5, 12 7.5\" fill=\"#8CC63F\"/>\r\n    <circle class=\"ageye\" cx=\"9.5\" cy=\"14.5\" r=\"1\" fill=\"#1B2117\"/>\r\n    <circle class=\"ageye\" cx=\"14.5\" cy=\"14.5\" r=\"1\" fill=\"#1B2117\"/>\r\n    <path class=\"agmouth\" d=\"M10 17.5 q2 1.5 4 0\" stroke=\"#1B2117\" stroke-width=\"1\" fill=\"none\" stroke-linecap=\"round\"/>\r\n  </g>\r\n</svg><span><b>아르</b></span><span class=\"agdot\"></span></button>\r\n<div class=\"me\">\r\n    <div>\r\n      <div class=\"name\">김채용</div>\r\n      <div class=\"role\">채용담당자</div>\r\n    </div>\r\n    <div class=\"avatar\">김</div>\r\n  </div>\r\n</aside>\r\n\r\n<div class=\"main\">\r\n  <header class=\"head\">\r\n    <div class=\"head-top\">\r\n      <button class=\"back\" id=\"back\" aria-label=\"공고의 지원자 화면으로\"><svg viewBox=\"0 0 24 24\"><path d=\"M19 12H5M11 6l-6 6 6 6\"/></svg></button>\r\n      <h1 class=\"title\">지원자 직접 등록</h1>\r\n      <span class=\"head-meta\" id=\"pmeta\">백엔드 개발자 (신입)</span>\r\n    </div>\r\n  </header>\r\n  <main class=\"content\">\r\n    <form class=\"pform\" id=\"aform\" novalidate>\r\n      <div class=\"tfield\">\r\n        <label for=\"a-name\">이름 <span class=\"req\">*</span></label>\r\n        <input class=\"tinput\" id=\"a-name\" type=\"text\" maxlength=\"50\" placeholder=\"김도현\">\r\n      </div>\r\n      <div class=\"tfield\">\r\n        <label for=\"a-email\">이메일 <span class=\"req\">*</span></label>\r\n        <input class=\"tinput\" id=\"a-email\" type=\"email\" maxlength=\"255\" placeholder=\"name@example.com\">\r\n      </div>\r\n      <div class=\"tfield\">\r\n        <label for=\"a-phone\">연락처 <span class=\"req\">*</span></label>\r\n        <input class=\"tinput\" id=\"a-phone\" type=\"tel\" maxlength=\"20\" placeholder=\"010-0000-0000\">\r\n      </div>\r\n      <div class=\"tfield\">\r\n        <label for=\"a-edu\">최종 학력</label>\r\n        <input class=\"tinput\" id=\"a-edu\" type=\"text\" maxlength=\"100\" placeholder=\"OO대학교 컴퓨터공학과\">\r\n      </div>\r\n      <div class=\"tfield\">\r\n        <label for=\"a-career\">경력 연차</label>\r\n        <input class=\"tinput\" id=\"a-career\" type=\"number\" min=\"0\" max=\"50\" placeholder=\"0 (신입)\">\r\n      </div>\r\n      <div class=\"tfield\">\r\n        <label for=\"a-skills\">기술</label>\r\n        <input class=\"tinput\" id=\"a-skills\" type=\"text\" placeholder=\"Python, FastAPI, PostgreSQL\">\r\n        <span class=\"filehint\">쉼표로 구분합니다</span>\r\n      </div>\r\n      <div class=\"tfield\">\r\n        <label for=\"a-intro\">자기소개서</label>\r\n        <textarea class=\"ninput\" id=\"a-intro\" rows=\"6\" placeholder=\"자기소개서 본문을 붙여 넣습니다\"></textarea>\r\n      </div>\r\n      <div class=\"upload-field\">\r\n        <label>이력서</label>\r\n        <div class=\"upload\">\r\n          <span class=\"ufile empty\">선택된 파일 없음</span>\r\n          <button class=\"ubtn\" type=\"button\">파일 선택</button>\r\n        </div>\r\n        <span class=\"filehint\">pdf · docx · hwp</span>\r\n      </div>\r\n      <div class=\"upload-field\">\r\n        <label>자기소개서 파일</label>\r\n        <div class=\"upload\">\r\n          <span class=\"ufile empty\">선택된 파일 없음</span>\r\n          <button class=\"ubtn\" type=\"button\">파일 선택</button>\r\n        </div>\r\n        <span class=\"filehint\">pdf · docx · hwp</span>\r\n      </div>\r\n      <div class=\"tfield\">\r\n        <label for=\"a-agreed\">개인정보 동의 시각 <span class=\"req\">*</span></label>\r\n        <input class=\"tinput\" id=\"a-agreed\" type=\"date\">\r\n        <span class=\"filehint\">오프라인으로 받은 동의 시각을 적습니다 (D6)</span>\r\n      </div>\r\n      <p class=\"hint\">담당자 등록이라 공고가 마감 상태여도 등록됩니다. 접수 단계로 들어갑니다.</p>\r\n      <div class=\"actions\">\r\n        <button class=\"btn btn-primary\" id=\"submit\" type=\"submit\" disabled>등록</button>\r\n        <button class=\"btn\" id=\"cancel\" type=\"button\" style=\"background:var(--bg-elev); border-color:var(--border); color:var(--text);\">취소</button>\r\n      </div>\r\n    </form>\r\n  </main>\r\n</div>\r\n\r\n\r\n\r\n<aside class=\"apanel\" id=\"apanel\" aria-label=\"아르 에이전트\">\r\n  <div class=\"ainner\">\r\n    <div class=\"ahead\">\r\n      <svg class=\"agchar\" id=\"agCharMain\" viewBox=\"0 0 24 24\" role=\"img\" aria-hidden=\"true\">\r\n  <g class=\"agbody\">\r\n    <circle cx=\"12\" cy=\"15\" r=\"7\" fill=\"#8CC63F\"/>\r\n    <path class=\"agleafL\" d=\"M12 8 C 12 4, 8 3, 6 4 C 7 7, 10 8, 12 8\" fill=\"#3A6B21\"/>\r\n    <path class=\"agleafR\" d=\"M12 8 C 12 5, 16 3.5, 18 4.5 C 17 7.5, 13 8, 12 8\" fill=\"#8CC63F\"/>\r\n    <path class=\"agnewleaf\" d=\"M12 7.5 C 11 5, 12.5 2.5, 14.5 2 C 15 4.5, 13.5 6.5, 12 7.5\" fill=\"#8CC63F\"/>\r\n    <circle class=\"ageye\" cx=\"9.5\" cy=\"14.5\" r=\"1\" fill=\"#1B2117\"/>\r\n    <circle class=\"ageye\" cx=\"14.5\" cy=\"14.5\" r=\"1\" fill=\"#1B2117\"/>\r\n    <path class=\"agmouth\" d=\"M10 17.5 q2 1.5 4 0\" stroke=\"#1B2117\" stroke-width=\"1\" fill=\"none\" stroke-linecap=\"round\"/>\r\n  </g>\r\n</svg>\r\n      <div><div class=\"aname\">아르</div></div>\r\n      <button class=\"aclose\" id=\"aclose\" aria-label=\"에이전트 닫기\"><svg viewBox=\"0 0 24 24\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg></button>\r\n    </div>\r\n    <div class=\"alog\" id=\"alog\" role=\"log\" aria-live=\"polite\"></div>\r\n    <div class=\"ainput-row\">\r\n      <div class=\"ainput\">\r\n        <input id=\"ainputEl\" placeholder=\"채용 업무를 맡겨보세요\" aria-label=\"에이전트 명령 입력\">\r\n        <button type=\"button\" class=\"amic\" id=\"amic\" aria-label=\"음성 입력\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"/><path d=\"M5 11a7 7 0 0 0 14 0M12 18v3\"/></svg></button>\r\n      </div>\r\n      <button type=\"button\" class=\"asend\" id=\"asend\" aria-label=\"전송\" disabled><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/><polyline points=\"13 6 19 12 13 18\"/></svg></button>\r\n    </div>\r\n  </div>\r\n</aside>\r\n\r\n\r\n","js":"\r\n// 어느 공고에 등록하는지 넘겨받아 헤더에 표시하고, 취소·뒤로가기 때 그대로 돌려준다\r\nvar params = new URLSearchParams(location.search);\r\nvar posting = params.get('posting');\r\nif (posting) document.getElementById('pmeta').textContent = posting;\r\nfunction backUrl(){ return posting ? 'mockup.html?' + params.toString() : 'mockup.html'; }\r\n\r\nvar req = ['a-name','a-email','a-phone','a-agreed'].map(function(id){ return document.getElementById(id); });\r\nvar submit = document.getElementById('submit');\r\nfunction toggle(){ submit.disabled = req.some(function(el){ return el.value.trim() === ''; }); }\r\nreq.forEach(function(el){ el.addEventListener('input', toggle); el.addEventListener('change', toggle); });\r\n\r\ndocument.getElementById('back').addEventListener('click', function(){ location.href = backUrl(); });\r\ndocument.getElementById('cancel').addEventListener('click', function(){ location.href = backUrl(); });\r\ndocument.getElementById('aform').addEventListener('submit', function(e){ e.preventDefault(); });\r\n\n\r\n/* ── 아르 에이전트 배선 (인수인계 데모와 동일 흐름) ────────────────\r\n   캐릭터 상태: setChar('enter'|'listen'|'think'|'ask'|'confirm'|'fail'|'')\r\n   쓰기 도구는 반드시 앰버 확인 카드 → [확인] 을 거친다 (ADR-0003). */\r\n(function(){\r\nvar ap=document.getElementById('apanel'), slot=document.getElementById('agSlot');\r\nvar log=document.getElementById('alog'), input=document.getElementById('ainputEl');\r\nvar mic=document.getElementById('amic');\r\nvar send=document.getElementById('asend');\r\nvar chars=[document.getElementById('agCharMain'), slot.querySelector('.agchar')];\r\nfunction setChar(s){ chars.forEach(function(c){ if(!c) return;\r\n  c.classList.remove('enter','listen','think','ask','confirm','fail');\r\n  void c.getBoundingClientRect(); if(s) c.classList.add(s); }); }\r\nfunction openAg(){ ap.classList.add('open'); localStorage.setItem('arda-open','1'); slot.classList.remove('pending');\r\n  var _dp=document.getElementById('dpanel'); if(_dp) _dp.classList.remove('open');\r\n  setChar('enter'); setTimeout(function(){ setChar(''); }, 500);\r\n  setTimeout(function(){ input.focus(); }, 300); }\r\nfunction closeAg(){ ap.classList.remove('open'); localStorage.removeItem('arda-open'); setChar(''); mic.classList.remove('on');\r\n  input.placeholder='채용 업무를 맡겨보세요'; }\r\nslot.addEventListener('click', function(){ ap.classList.contains('open')?closeAg():openAg(); });\r\ndocument.getElementById('aclose').addEventListener('click', closeAg);\r\ndocument.addEventListener('keydown', function(e){\r\n  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openAg(); }\r\n  /* Esc 는 상세 패널도 쓴다. 에이전트가 열려 있을 때만 삼키고, 아니면 원래 핸들러에 넘긴다. */\r\n  if(e.key==='Escape' && ap.classList.contains('open')){ e.stopPropagation(); closeAg(); }\r\n}, true);\r\nmic.addEventListener('click', function(){\r\n  var on=mic.classList.toggle('on'); setChar(on?'listen':'');\r\n  input.placeholder = on ? '듣고 있어요…' : '채용 업무를 맡겨보세요';\r\n});\r\nfunction el(cls, html){ var d=document.createElement('div'); d.className=cls; d.innerHTML=html; return d; }\r\nfunction scrollEnd(){ log.scrollTop=log.scrollHeight; }\r\nvar CHAR_SM='<svg class=\"agchar\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">'+document.getElementById('agCharMain').innerHTML+'<\\/svg>';\r\ninput.addEventListener('input', function(){ if(send) send.disabled=!input.value.trim(); });\r\nif(send) send.addEventListener('click', function(){ input.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true})); });\r\ninput.addEventListener('keydown', function(e){\r\n  if(e.key!=='Enter' || !input.value.trim()) return;\r\n  var q=input.value.trim(); input.value=''; mic.classList.remove('on'); if(send) send.disabled=true;\r\n  log.appendChild(el('amsg-user', q)); scrollEnd();\r\n  setChar('think');\r\n  setTimeout(function(){\r\n    log.appendChild(el('atool', '✓ 검색: 기술 Python · 경력 2년 이상<br>✓ 결과 3명 — 박서연 · 이준호 · 최유진')); scrollEnd();\r\n  }, 700);\r\n  setTimeout(function(){\r\n    setChar('ask'); slot.classList.add('pending');\r\n    var row=el('arow-ai', CHAR_SM+\r\n      '<div class=\"acard-ai\">3명을 <b>서류 검토 → 면접</b> 단계로 옮길까요?'+\r\n      '<div class=\"abtns\"><button type=\"button\" class=\"abtn-ok\">확인</button>'+\r\n      '<button type=\"button\" class=\"abtn-no\">취소</button></div></div>');\r\n    row.querySelector('.abtn-ok').addEventListener('click', function(){\r\n      row.querySelector('.abtns').remove(); slot.classList.remove('pending');\r\n      setChar('confirm');\r\n      log.appendChild(el('acard-done', '✓ 3명을 면접 단계로 옮겼어요. 단계 이력에 기록됐습니다.')); scrollEnd();\r\n      setTimeout(function(){ setChar(''); }, 900);\r\n    });\r\n    row.querySelector('.abtn-no').addEventListener('click', function(){\r\n      row.querySelector('.abtns').remove(); slot.classList.remove('pending');\r\n      setChar('fail');\r\n      log.appendChild(el('atool', '취소했어요. 변경 없음.')); scrollEnd();\r\n      setTimeout(function(){ setChar(''); }, 1200);\r\n    });\r\n    log.appendChild(row); scrollEnd();\r\n  }, 1500);\r\n});\r\nif(localStorage.getItem('arda-open')==='1') ap.classList.add('open');\r\n})();\r\n"},
  "mockup-login.html": {"css":"\r\n:root{\r\n  --bg:#F4F7F0;\r\n  --sidebar-bg:#C7E49B;    /* 연두: 확실히 초록으로 읽히되 어둡지 않은 중간 톤 */\r\n  --sidebar-line:#A8CD6E;  /* 사이드바 오른쪽 경계선: 배경보다 한 단계 진한 연두 1px */\r\n  --border-w:1px;\r\n  --sidebar-w:216px;\r\n  --content-x:48px;\r\n  --text:#1B2117;\r\n  --text-sub:#5C6654;\r\n  --leaf:#3A6B21;\r\n  --leaf-strong:#2C5218;\r\n  --danger:#A9503C;\r\n  --ai:#A9702A;            /* AI 제안 — 앰버 점선 규약 (05-design 확정) */\r\n  --ai-soft:#FBF2E5;       /* AI 제안 워시 */\r\n  --sans:\"IBM Plex Sans KR\",system-ui,\"Malgun Gothic\",sans-serif;\r\n  --font-num:14px;\r\n  --font-display:26px; --font-h1:22px; --font-h2:18px; --font-body:16px; --font-sm:14px; --font-caption:12px;\r\n  --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:40px; --sp-8:48px;\r\n  --r-ctl:6px; --r-card:8px;\r\n  --bg-elev:#FFFFFF;\r\n  --border:#DCE3D4;\r\n  --border-soft:#EAEFE4;\r\n  --bg-sunken:#EBF0E5;     /* 인풋·트랙: 패널보다 한 단계 아래 */\r\n  --sunken-hover:#DCE3D4;  /* sunken 바탕 위 hover 채움: 한 톤 진하게 */\r\n  --ts-heading:0 1px 0 rgba(27,33,23,.34);\r\n  --ts-onfill:0 1px 0 rgba(0,0,0,.62);\r\n  --z-sticky:10;\r\n  --dur-fast:120ms; --dur-base:200ms; --ease:cubic-bezier(.2,0,0,1);\r\n}\r\n@media (prefers-reduced-motion: reduce){ *{ transition-duration:0ms !important; } }\r\n*{ box-sizing:border-box; margin:0; }\r\nbody{ background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:var(--sp-5); }\r\n\r\n.logo{ font-family:var(--sans); font-size:var(--font-h1); font-weight:700; letter-spacing:-.01em;\r\n       color:var(--text); text-shadow:var(--ts-heading); white-space:nowrap; padding:0 var(--sp-3); }\r\n.logo .seed{ color:var(--leaf); }\r\n\r\n.btn{ font-family:var(--sans); font-size:var(--font-sm); font-weight:600; white-space:nowrap;\r\n      height:40px; padding:0 var(--sp-4); border-radius:var(--r-ctl); border:var(--border-w) solid transparent;\r\n      cursor:pointer; transition:background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease); }\r\n.btn:active{ transform:translateY(1px); }\r\n.btn:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.btn-primary{ background:var(--leaf); color:#fff; text-shadow:var(--ts-onfill); }\r\n.btn-primary:hover{ background:#2C5218; }\r\n.btn-primary:disabled{ background:#C7D0BC; color:var(--text-sub); text-shadow:none; cursor:not-allowed; }\r\n.btn-primary:disabled:active{ transform:none; }\r\n\r\n.card{ width:360px; max-width:100%; padding:var(--sp-6);\r\n       background:var(--bg-elev); border:var(--border-w) solid var(--border); border-radius:var(--r-card); }\r\n.card .logo{ padding:0; margin-bottom:var(--sp-6); }\r\n\r\n.form{ display:flex; flex-direction:column; gap:var(--sp-4); }\r\n\r\n.tfield{ display:flex; flex-direction:column; gap:var(--sp-2); }\r\n.tfield label{ font-family:var(--sans); font-size:var(--font-sm); font-weight:600; color:var(--text); }\r\n.tinput{ width:100%; height:40px; padding:0 var(--sp-3);\r\n         border:var(--border-w) solid var(--border); border-radius:var(--r-ctl);\r\n         background:var(--bg-elev); font-family:var(--sans); font-size:var(--font-body); color:var(--text);\r\n         transition:border-color var(--dur-fast) var(--ease); }\r\n.tinput::placeholder{ color:var(--text-sub); }\r\n.tinput:hover{ border-color:var(--sunken-hover); }\r\n.tinput:focus-visible{ outline:2px solid var(--leaf); outline-offset:1px; border-color:var(--leaf); }\r\n.tinput:disabled{ background:var(--bg-sunken); color:var(--text-sub); cursor:not-allowed; }\r\n\r\n.form-error{ font-family:var(--sans); font-size:var(--font-caption); color:var(--danger); }\r\n.form-error[hidden]{ display:none; }\r\n\r\n.form .btn-primary{ width:100%; }\r\n","body":"\r\n\r\n<div class=\"card\">\r\n  <div class=\"logo\"><span class=\"seed\">A</span>rda</div>\r\n  <form class=\"form\" id=\"login-form\" novalidate>\r\n    <div class=\"tfield\">\r\n      <label for=\"email\">이메일</label>\r\n      <input class=\"tinput\" id=\"email\" type=\"email\" autocomplete=\"username\" placeholder=\"name@company.com\">\r\n    </div>\r\n    <div class=\"tfield\">\r\n      <label for=\"password\">비밀번호</label>\r\n      <input class=\"tinput\" id=\"password\" type=\"password\" autocomplete=\"current-password\" placeholder=\"비밀번호\">\r\n    </div>\r\n    <!-- 화면 확인용: 아래 hidden 속성을 지우면 실패 문구가 보인다 -->\r\n    <p class=\"form-error\" id=\"form-error\" hidden>이메일 또는 비밀번호가 올바르지 않습니다.</p>\r\n    <button class=\"btn btn-primary\" id=\"submit\" type=\"submit\" disabled>로그인</button>\r\n  </form>\r\n</div>\r\n\r\n\r\n","js":"\r\nvar email=document.getElementById('email'), password=document.getElementById('password'), submit=document.getElementById('submit');\r\nfunction toggle(){ submit.disabled = email.value.trim()==='' || password.value.trim()===''; }\r\nemail.addEventListener('input', toggle);\r\npassword.addEventListener('input', toggle);\r\n"},
  "mockup-apply.html": {"css":"\r\n:root{\r\n  --bg:#F4F7F0;\r\n  --sidebar-bg:#C7E49B;    /* 연두: 확실히 초록으로 읽히되 어둡지 않은 중간 톤 */\r\n  --sidebar-line:#A8CD6E;  /* 사이드바 오른쪽 경계선: 배경보다 한 단계 진한 연두 1px */\r\n  --border-w:1px;\r\n  --sidebar-w:216px;\r\n  --content-x:48px;\r\n  --text:#1B2117;\r\n  --text-sub:#5C6654;\r\n  --leaf:#3A6B21;\r\n  --leaf-strong:#2C5218;\r\n  --danger:#A9503C;\r\n  --ai:#A9702A;            /* AI 제안 — 앰버 점선 규약 (05-design 확정) */\r\n  --ai-soft:#FBF2E5;       /* AI 제안 워시 */\r\n  --sans:\"IBM Plex Sans KR\",system-ui,\"Malgun Gothic\",sans-serif;\r\n  --font-num:14px;\r\n  --font-display:26px; --font-h1:22px; --font-h2:18px; --font-body:16px; --font-sm:14px; --font-caption:12px;\r\n  --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:40px; --sp-8:48px;\r\n  --r-ctl:6px; --r-card:8px;\r\n  --bg-elev:#FFFFFF;\r\n  --border:#DCE3D4;\r\n  --border-soft:#EAEFE4;\r\n  --bg-sunken:#EBF0E5;     /* 인풋·트랙: 패널보다 한 단계 아래 */\r\n  --sunken-hover:#DCE3D4;  /* sunken 바탕 위 hover 채움: 한 톤 진하게 */\r\n  --sprout:#8CC63F;\r\n  --ts-heading:0 1px 0 rgba(27,33,23,.34);\r\n  --ts-onfill:0 1px 0 rgba(0,0,0,.62);\r\n  --z-sticky:10;\r\n  --dur-fast:120ms; --dur-base:200ms; --ease:cubic-bezier(.2,0,0,1);\r\n}\r\n@media (prefers-reduced-motion: reduce){ *{ transition-duration:0ms !important; } }\r\n*{ box-sizing:border-box; margin:0; }\r\nbody{ background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:var(--sp-5); }\r\n\r\n.logo{ font-family:var(--sans); font-size:var(--font-h1); font-weight:700; letter-spacing:-.01em;\r\n       color:var(--text); text-shadow:var(--ts-heading); white-space:nowrap; }\r\n.logo .seed{ color:var(--leaf); }\r\n\r\n.badge{ display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 var(--sp-3);\r\n        border-radius:999px; font-family:var(--sans); font-size:var(--font-sm); font-weight:600;\r\n        white-space:nowrap; flex:none; }\r\n.badge-open{ background:#EFF7E2; co ut::placeholder{ color:var(--text-sub); }\r\n.tinput:hover{ border-color:var(--sunken-hover); }\r\n.tinput:focus-visible{ outline:2px solid var(--leaf); outline-offset:1px; border-color:var(--leaf); }\r\n.tinput:disabled{ background:var(--bg-sunken); color:var(--text-sub); cursor:not-allowed; }\r\n\r\n.ninput{ display:block; width:100%; min-height:76px; resize:vertical; margin-bottom:var(--sp-2);\r\n         padding:var(--sp-3); border:var(--border-w) solid var(--border); border-radius:var(--r-ctl);\r\n         background:var(--bg-elev); font-family:var(--sans); font-size:var(--font-sm); line-height:1.55;\r\n         color:var(--text); transition:border-color var(--dur-fast) var(--ease); }\r\n.ninput::placeholder{ color:var(--text-sub); }\r\n.ninput:hover{ border-color:#C7D0BC; }\r\n.ninput:focus-visible{ outline:2px solid var(--leaf); outline-offset:1px; border-color:var(--leaf); }\r\n\r\n.upload{ display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3);\r\n         background:var(--bg-sunken); border-radius:var(--r-card); font-family:var(--sans); }\r\n.upload .ufile{ flex:1; min-width:0; font-size:var(--font-sm); color:var(--text);\r\n                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }\r\n.upload .ufile.empty{ color:var(--text-sub); }\r\n.upload .ubtn{ flex:none; height:32px; padding:0 var(--sp-3); border-radius:var(--r-ctl);\r\n               background:var(--bg-elev); border:var(--border-w) solid var(--border);\r\n               font-family:var(--sans); font-size:var(--font-sm); font-weight:600; color:var(--text);\r\n               white-space:nowrap; cursor:pointer; text-shadow:var(--ts-heading);\r\n               transition:background var(--dur-fast) var(--ease); }\r\n.upload .ubtn:hover{ background:var(--bg-sunken); }\r\n.upload .ubtn:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n\r\n.prog{ height:6px; margin-top:var(--sp-2); border-radius:999px;\r\n       background:var(--bg-sunken); overflow:
