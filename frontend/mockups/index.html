<div class=\"tfield\">\r\n      <label for=\"education\">최종 학력</label>\r\n      <input class=\"tinput\" id=\"education\" type=\"text\" placeholder=\"OO대학교 컴퓨터공학과\">\r\n    </div>\r\n    <div class=\"tfield\">\r\n      <label for=\"career\">경력 연차</label>\r\n      <input class=\"tinput\" id=\"career\" type=\"text\" placeholder=\"신입 또는 N년\">\r\n    </div>\r\n\r\n    <div class=\"tfield\">\r\n      <label for=\"self-intro\">자기소개서</label>\r\n      <textarea class=\"ninput\" id=\"self-intro\" rows=\"6\" placeholder=\"자기소개서를 입력해 주세요\"></textarea>\r\n    </div>\r\n\r\n    <div class=\"upload-field\">\r\n      <label id=\"resume-label\">이력서</label>\r\n      <div class=\"upload\">\r\n        <span class=\"ufile\">김도현_이력서.pdf</span>\r\n        <button type=\"button\" class=\"ubtn\" aria-labelledby=\"resume-label\">파일 선택</button>\r\n      </div>\r\n      <div class=\"prog\"><span style=\"width:60%\"></span></div>\r\n    </div>\r\n\r\n    <div class=\"upload-field\">\r\n      <label id=\"cover-label\">자기소개서 파일</label>\r\n      <div class=\"upload\">\r\n        <span class=\"ufile empty\">선택된 파일 없음</span>\r\n        <button type=\"button\" class=\"ubtn\" aria-labelledby=\"cover-label\">파일 선택</button>\r\n      </div>\r\n    </div>\r\n\r\n    <p class=\"filehint\">PDF · DOCX · HWP · 10MB 이하</p>\r\n\r\n    <div class=\"agree\">\r\n      <input type=\"checkbox\" id=\"privacy\">\r\n      <label for=\"privacy\">개인정보 수집·이용에 동의합니다.\r\n        <span class=\"req\">동의하지 않으면 제출할 수 없습니다.</span>\r\n      </label>\r\n    </div>\r\n\r\n    <button class=\"btn btn-primary\" id=\"submit\" type=\"submit\" disabled>지원서 제출</button>\r\n  </form>\r\n</div>\r\n\r\n\r\n","js":"\r\nvar privacy=document.getElementById('privacy'), submit=document.getElementById('submit');\r\nprivacy.addEventListener('change', function(){ submit.disabled = !privacy.checked; });\r\n"},
  "mockup-mobile.html": {"css":"\r\n:root{\r\n  --bg:#F4F7F0;\r\n  --sidebar-bg:#C7E49B;    /* 연두: 확실히 초록으로 읽히되 어둡지 않은 중간 톤 */\r\n  --sidebar-line:#A8CD6E;  /* 사이드바 오른쪽 경계선: 배경보다 한 단계 진한 연두 1px */\r\n  --border-w:1px;\r\n  --sidebar-w:216px;\r\n  --content-x:48px;\r\n  --text:#1B2117;\r\n  --text-sub:#5C6654;\r\n  --leaf:#3A6B21;\r\n  --leaf-strong:#2C5218;\r\n  --danger:#A9503C;\r\n  --ai:#A9702A;            /* AI 제안 — 앰버 점선 규약 (05-design 확정) */\r\n  --ai-soft:#FBF2E5;       /* AI 제안 워시 */\r\n  --sans:\"IBM Plex Sans KR\",system-ui,\"Malgun Gothic\",sans-serif;\r\n  --font-num:14px;\r\n  --font-display:26px; --font-h1:22px; --font-h2:18px; --font-body:16px; --font-sm:14px; --font-caption:12px;\r\n  --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:40px; --sp-8:48px;\r\n  --r-ctl:6px; --r-card:8px;\r\n  --bg-elev:#FFFFFF;\r\n  --border:#DCE3D4;\r\n  --border-soft:#EAEFE4;\r\n  --bg-sunken:#EBF0E5;     /* 인풋·트랙: 패널보다 한 단계 아래 */\r\n  --sunken-hover:#DCE3D4;  /* sunken 바탕 위 hover 채움: 한 톤 진하게 */\r\n  --ts-heading:0 1px 0 rgba(27,33,23,.34);\r\n  --ts-onfill:0 1px 0 rgba(0,0,0,.62);\r\n  --z-sticky:10;\r\n  --dur-fast:120ms; --dur-base:200ms; --ease:cubic-bezier(.2,0,0,1);\r\n}\r\n@media (prefers-reduced-motion: reduce){ *{ transition-duration:0ms !important; } }\r\n*{ box-sizing:border-box; margin:0; }\r\nbody{ background:var(--bg); min-height:100vh; overflow-x:hidden; }\r\n\r\n/* ── 상단 바 ─────────────────────────────────────────────\r\n   .logo는 mockup.html 복사. 사이드바는 넣지 않는다(05-design §9 모바일). */\r\n.mbar{ display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3);\r\n       padding:var(--sp-2) var(--sp-3); background:var(--bg-elev);\r\n       border-bottom:var(--border-w) solid #DCE3D4; }\r\n.logo{ font-family:var(--sans); font-size:var(--font-h1); font-weight:700; letter-spacing:-.01em;\r\n       color:var(--text); text-shadow:var(--ts-heading); white-space:nowrap; padding:0 var(--sp-3); }\r\n.logo .seed{ color:var(--leaf); }\r\n/* mockup.html .back 복사 — 터치 타깃 44×44(HIG, 05-design §9)로만 키우고 hover는 뺀다 */\r\n.micon{ width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center;\r\n        background:var(--bg-elev); border:var(--border-w) solid #DCE3D4; border-radius:var(--r-ctl);\r\n        cursor:pointer; transition:background var(--dur-fast) var(--ease); }\r\n.micon:active{ background:#DCE3D4; }\r\n.micon:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.micon svg{ width:20px; height:20px; stroke:var(--text); fill:none; stroke-width:2;\r\n            stroke-linecap:round; stroke-linejoin:round; }\r\n\r\n/* ── 공고명 + 마감 D-day ───────────────────────────────── */\r\n.mposting{ display:flex; align-items:baseline; gap:var(--sp-3);\r\n           padding:var(--sp-3); background:var(--bg-elev);\r\n           border-bottom:var(--border-w) solid #DCE3D4; }\r\n.mposting .mptitle{ flex:1; min-width:0; font-family:var(--sans); font-size:var(--font-h2); font-weight:700;\r\n                    color:var(--text); text-shadow:var(--ts-heading);\r\n                    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }\r\n.head-meta{ font-family:var(--sans); font-size:var(--font-num); font-variant-numeric:tabular-nums;\r\n            color:var(--text-sub); white-space:nowrap; flex:none; }\r\n\r\n/* ── 단계 탭 (칸반 대체, 05-design §9) ──────────────────\r\n   선택 표시는 mockup.html의 .vtoggle button.on 규격을 그대로 따른다.\r\n   탭 줄만 가로 스크롤 — 페이지 자체는 스크롤하지 않는다. */\r\n.tabs{ display:flex; gap:var(--sp-2); overflow-x:auto; padding:var(--sp-2) var(--sp-3);\r\n       background:var(--bg-elev); border-bottom:var(--border-w) solid #DCE3D4; }\r\n.tabs button{ flex:none; height:44px; padding:0 var(--sp-4); border:none; border-radius:var(--r-ctl);\r\n              background:var(--bg-elev); color:var(--text-sub); cursor:pointer; white-space:nowrap;\r\n              font-family:var(--sans); font-size:var(--font-sm); font-weight:600;\r\n              transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }\r\n.tabs button:active{ background:var(--bg-sunken); }\r\n.tabs button:focus-visible{ outline:2px solid var(--leaf); outline-offset:-2px; }\r\n.tabs button.on{ background:#EFF7E2; color:var(--leaf); text-shadow:var(--ts-heading); }\r\n\r\n/* ── 지원자 카드 리스트 (지시서 제공 CSS 그대로) ───────── */\r\n.mlist{ display:flex; flex-direction:column; gap:var(--sp-2); padding:var(--sp-3); }\r\n.mcard{ display:block; width:100%; text-align:left; min-height:72px; padding:var(--sp-3);\r\n        background:var(--bg-elev); border:var(--border-w) solid var(--border);\r\n        border-radius:var(--r-card); font-family:var(--sans); cursor:pointer; }\r\n.mcard:active{ background:var(--bg-sunken); }\r\n.mcard:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.mcard .mtop{ display:flex; align-items:baseline; gap:var(--sp-2); }\r\n.mcard .mname{ flex:1; min-width:0; font-size:var(--font-body); font-weight:600; color:var(--text);\r\n               white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }\r\n.mcard .msub{ display:block; margin-top:var(--sp-2); font-size:var(--font-sm); color:var(--text-sub);\r\n              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }\r\n.mcard .mdate{ display:block; margin-top:4px; font-size:var(--font-caption); color:var(--text-sub);\r\n               font-variant-numeric:tabular-nums; }\r\n.stage{ white-space:nowrap; }\r\n.stage-progress{ color:var(--text-sub); }\r\n.stage-accepted{ color:var(--leaf); font-weight:700; }\r\n.stage-rejected{ color:var(--danger, #A9503C); font-weight:700; }\r\n/* mockup.html .dhead .stage 와 같은 규격 */\r\n.mcard .stage{ flex:none; font-size:var(--font-sm); }\r\n\r\n/* ── 상세 = 전체 화면 오버레이 ──────────────────────────\r\n   mockup.html의 .dpanel 1100px 미디어 쿼리 방식(fixed + translateX + .open)을 복사하고,\r\n   폭만 화면 전체로 맞춘다. 이 파일 전체가 768px 이하 뷰라 미디어 쿼리는 팀장이 합칠 때 붙인다. */\r\n.dpanel{ position:fixed; top:0; right:0; bottom:0; left:0; z-index:30;\r\n         background:var(--bg-elev); box-shadow:0 8px 28px rgba(27,33,23,.14);\r\n         transform:translateX(100%); transition:transform var(--dur-base) var(--ease); }\r\n.dpanel.open{ transform:none; }\r\n.dpanel .dinner{ width:100%; height:100%; overflow-y:auto; overscroll-behavior:contain;\r\n                 display:flex; flex-direction:column; }\r\n.dpanel .dclose{ position:absolute; top:var(--sp-4); right:var(--sp-4); z-index:var(--z-sticky); width:44px; height:44px;\r\n                 display:flex; align-items:center; justify-content:center; cursor:pointer;\r\n                 background:var(--bg-elev); border:var(--border-w) solid #DCE3D4; border-radius:var(--r-ctl);\r\n                 transition:background var(--dur-fast) var(--ease); }\r\n.dpanel .dclose:active{ background:#DCE3D4; }\r\n.dpanel .dclose:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.dpanel .dclose svg{ width:18px; height:18px; stroke:var(--text); fill:none; stroke-width:2; stroke-linecap:round; }\r\n.dhead{ position:sticky; top:0; z-index:var(--z-sticky); background:var(--bg-elev);\r\n        display:flex; align-items:baseline; gap:var(--sp-3); padding:var(--sp-5) var(--sp-5) var(--sp-4);\r\n        border-bottom:var(--border-w) solid #DCE3D4; padding-right:80px; }\r\n.dhead .dname{ font-family:var(--sans); font-size:var(--font-h1); font-weight:700; letter-spacing:-.01em;\r\n               color:var(--text); text-shadow:var(--ts-heading); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }\r\n.dhead .stage{ font-family:var(--sans); font-size:var(--font-sm); flex:none; }\r\n.dsec{ padding:var(--sp-4) var(--sp-5); border-bottom:var(--border-w) solid #EAEFE4; }\r\n.dsec h2{ font-family:var(--sans); font-size:var(--font-h2); font-weight:700; color:var(--text);\r\n          text-shadow:var(--ts-heading); margin-bottom:var(--sp-3); }\r\n.dlist{ display:grid; grid-template-columns:88px 1fr; row-gap:var(--sp-2); column-gap:var(--sp-4);\r\n        font-family:var(--sans); font-size:var(--font-sm); }\r\n.dlist dt{ color:var(--text-sub); white-space:nowrap; }\r\n.dlist dd{ margin:0; color:var(--text); overflow-wrap:break-word; font-variant-numeric:tabular-nums; }\r\n/* 드래그가 없는 환경의 유일한 단계 이동 수단 (05-design §10) */\r\n.dfoot{ position:sticky; bottom:0; margin-top:auto; z-index:var(--z-sticky); min-height:72px;\r\n        background:var(--bg-elev); border-top:var(--border-w) solid var(--border);\r\n        display:flex; align-items:center; padding:0 var(--sp-5); }\r\n.btn{ font-family:var(--sans); font-size:var(--font-sm); font-weight:600; white-space:nowrap;\r\n      height:40px; padding:0 var(--sp-4); border-radius:var(--r-ctl); border:var(--border-w) solid transparent;\r\n      cursor:pointer; transition:background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease); }\r\n.btn:active{ transform:translateY(1px); }\r\n.btn:focus-visible{ outline:2px solid var(--leaf); outline-offset:2px; }\r\n.btn-primary{ background:var(--leaf); color:#fff; text-shadow:var(--ts-onfill); }\r\n.dfoot .btn{ flex:1; height:44px; }\r\n","body":"\r\n\r\n<header class=\"mbar\">\r\n  <div class=\"logo\">Arda</div>\r\n  <button class=\"micon\" aria-label=\"검색\"><svg viewBox=\"0 0 24 24\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"/><path d=\"M15.8 15.8L20 20\"/></svg></button>\r\n</header>\r\n\r\n<div class=\"mposting\">\r\n  <span class=\"mptitle\">백엔드 개발자 (신입)</span>\r\n  <span class=\"head-meta\">마감 D-12</span>\r\n</div>\r\n\r\n<nav class=\"tabs\" role=\"tablist\" aria-label=\"단계\">\r\n  <button type=\"button\" role=\"tab\" class=\"on\" aria-selected=\"true\">지원 접수</button>\r\n  <button type=\"button\" role=\"tab\" aria-selected=\"false\">서류 검토</button>\r\n  <button type=\"button\" role=\"tab\" aria-selected=\"false\">면접</button>\r\n  <button type=\"button\" role=\"tab\" aria-selected=\"false\">최종 합격</button>\r\n  <button type=\"button\" role=\"tab\" aria-selected=\"false\">불합격</button>\r\n</nav>\r\n\r\n<div class=\"mlist\">\r\n  <button class=\"mcard\" type=\"button\" data-edu=\"OO대학교 컴퓨터공학과\" data-career=\"2년 (백엔드)\" data-date=\"2026.03.12\">\r\n    <span class=\"mtop\">\r\n      <span class=\"mname\">김도현</span>\r\n      <span class=\"stage stage-progress\">면접</span>\r\n    </span>\r\n    <span class=\"msub\">2년 · OO대 컴퓨터공학 · Python · FastAPI</span>\r\n    <span class=\"mdate\">2026.03.12</span>\r\n  </button>\r\n  <button class=\"mcard\" type=\"button\" data-edu=\"OO대학원 컴퓨터공학 석사\" data-career=\"12년 (백엔드·인프라)\" data-date=\"2026.03.12\">\r\n    <span class=\"mtop\">\r\n      <span class=\"mname\">크리스토퍼 알렉산더 요한 반 데 베르그 주니어 3세</span>\r\n      <span class=\"stage stage-progress\">면접</span>\r\n    </span>\r\n    <span class=\"msub\">12년 · 석사 졸업 · Python · FastAPI · PostgreSQL · Docker · AWS · Kubernetes</span>\r\n    <span class=\"mdate\">2026.03.12</span>\r\n  </button>\r\n  <button class=\"mcard\" type=\"button\" data-edu=\"OO대학교 컴퓨터공학과 졸업\" data-career=\"신입\" data-date=\"2026.03.11\">\r\n    <span class=\"mtop\">\r\n      <span class=\"mname\">박지훈</span>\r\n      <span class=\"stage stage-progress\">지원 접수</span>\r\n    </span>\r\n    <span class=\"msub\">신입 · 컴퓨터공학 졸업 · Python · FastAPI</span>\r\n    <span class=\"mdate\">2026.03.11</span>\r\n  </button>\r\n  <button class=\"mcard\" type=\"button\" data-edu=\"OO대학교 소프트웨어학과\" data-career=\"1년 (백엔드)\" data-date=\"2026.03.11\">\r\n    <span class=\"mtop\">\r\n      <span class=\"mname\">정우진</span>\r\n      <span class=\"stage stage-progress\">서류 검토</span>\r\n    </span>\r\n    <span class=\"msub\">1년 · OO대 소프트웨어학과 · Python · AWS · Docker</span>\r\n    <span class=\"mdate\">2026.03.11</span>\r\n  </button>\r\n  <button class=\"mcard\" type=\"button\" data-edu=\"부트캠프 수료\" data-career=\"1년 (백엔드)\" data-date=\"2026.03.10\">\r\n    <span class=\"mtop\">\r\n      <span class=\"mname\">윤하늘</span>\r\n      <span class=\"stage stage-accepted\">최종 합격</span>\r\n    </span>\r\n    <span class=\"msub\">1년 · 부트캠프 수료 · FastAPI · PostgreSQL</span>\r\n    <span class=\"mdate\">2026.03.10</span>\r\n  </button>\r\n  <button class=\"mcard\" type=\"button\" data-edu=\"OO대학교 전자공학과\" data-career=\"신입\" data-date=\"2026.03.09\">\r\n    <span class=\"mtop\">\r\n      <span class=\"mname\">강민수</span>\r\n      <span class=\"stage stage-rejected\">불합격</span>\r\n    </span>\r\n    <span class=\"msub\">신입 · 전자공학 졸업 · PHP</span>\r\n    <span class=\"mdate\">2026.03.09</span>\r\n  </button>\r\n</div>\r\n\r\n<aside class=\"dpanel\" id=\"dpanel\" aria-label=\"지원자 상세\">\r\n  <div class=\"dinner\">\r\n    <div class=\"dhead\">\r\n      <span class=\"dname\">김도현</span>\r\n      <span class=\"stage stage-progress\">면접</span>\r\n    </div>\r\n    <button class=\"dclose\" id=\"dclose\" aria-label=\"상세 닫기\"><svg viewBox=\"0 0 24 24\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg></button>\r\n    <div class=\"dsec\">\r\n      <h2>지원 정보</h2>\r\n      <dl class=\"dlist\">\r\n        <dt>학력</dt><dd data-f=\"edu\">OO대학교 컴퓨터공학과</dd>\r\n        <dt>경력</dt><dd data-f=\"career\">2년 (백엔드)</dd>\r\n        <dt>지원일</dt><dd data-f=\"date\">2026.03.12</dd>\r\n      </dl>\r\n    </div>\r\n    <div class=\"dfoot\">\r\n      <button class=\"btn btn-primary\" type=\"button\">단계 변경</button>\r\n    </div>\r\n  </div>\r\n</aside>\r\n\r\n\r\n","js":"\r\ndocument.querySelectorAll('.tabs button').forEach(function(t){\r\n  t.addEventListener('click',function(){\r\n    document.querySelectorAll('.tabs button').forEach(function(o){\r\n      o.classList.remove('on'); o.setAttribute('aria-selected','false');\r\n    });\r\n    t.classList.add('on'); t.setAttribute('aria-selected','true');\r\n  });\r\n});\r\n\r\nvar dp=document.getElementById('dpanel');\r\nvar dName=dp.querySelector('.dname'), dStage=dp.querySelector('.dhead .stage');\r\ndocument.querySelectorAll('.mcard').forEach(function(c){\r\n  c.addEventListener('click',function(){\r\n    var cn=c.querySelector('.mname'), cs=c.querySelector('.stage');\r\n    dName.textContent=cn.textContent;\r\n    dStage.textContent=cs.textContent; dStage.className=cs.className;\r\n    dp.querySelectorAll('.dlist dd[data-f]').forEach(function(dd){\r\n      var v=c.getAttribute('data-'+dd.getAttribute('data-f'));\r\n      dd.textContent = v!==null ? v : '—';\r\n    });\r\n    dp.classList.add('open');\r\n  });\r\n});\r\ndocument.getElementById('dclose').addEventListener('click',function(){ dp.classList.remove('open'); });\r\ndocument.addEventListener('keydown',function(e){ if(e.key==='Escape') dp.classList.remove('open'); });\r\n"},

var TITLES = {"mockup-dashboard.html":"대시보드","mockup-postings.html":"채용 공고","mockup.html":"공고의 지원자","mockup-applicants.html":"지원자","mockup-interviews.html":"면접 일정","mockup-evaluations.html":"평가 현황","mockup-settings.html":"설정","mockup-posting-new.html":"공고 등록","mockup-applicant-new.html":"지원자 등록","mockup-login.html":"로그인","mockup-apply.html":"지원서 접수","mockup-mobile.html":"모바일"};
var styleEl = document.getElementById('scr');

function show(file, query) {
  var s = SCREENS[file];
  if (!s) { return; }

  styleEl.textContent = s.css;
  document.body.innerHTML = s.body;
  document.title = 'Arda 목업 — ' + (TITLES[file] || file);

  // 원본은 location.search 로 파라미터를 읽고 location.href 로 화면을 옮긴다.
  // 한 파일 안에는 주소가 없으므로 그 두 지점만 갈아끼운다.
  var code = s.js
    .replace(/location\.href\s*=/g, '__loc.href=')
    .replace(/location\.search/g, JSON.stringify(query || ''));
  try {
    new Function('__loc', code)({ set href(u) { go(u); } });
  } catch (err) {
    console.error('[' + file + '] script error', err);
  }
}

function go(url) {
  var u = String(url);
  var i = u.indexOf('?');
  var file = (i < 0 ? u : u.slice(0, i)).split('/').pop();
  var query = i < 0 ? '' : u.slice(i);
  if (SCREENS[file]) { show(file, query); window.scrollTo(0, 0); }
}

// 화면 안의 링크는 전부 여기서 가로챈다
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[href]');
  if (!a) { return; }
  var href = a.getAttribute('href');
  if (!href || href.charAt(0) === '#') { return; }
  if (/^(https?:|mailto:)/i.test(href)) { return; }
  e.preventDefault();
  go(href);
}, true);

show("mockup-dashboard.html", '');
</script>
