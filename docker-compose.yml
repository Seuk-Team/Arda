# docker-compose.yml (저장소 루트)
services:
  db:
    # pgvector 확장이 들어 있는 PG 16 이미지. 순정 postgres:16-alpine 에는 vector 확장이
    # 없어서 RAG(ADR-0021)의 CREATE EXTENSION 이 실패하고 시맨틱 검색이 꺼진다
    # (2026-08-31 운영에서 이걸로 API 가 재시작 루프에 빠졌다 — docs/00_overview/07-deploy.md).
    # ※ 기존 pgdata 볼륨을 alpine(musl) 로 만들어 쓰던 사람은 베이스가 glibc 로 바뀌므로
    #   텍스트 인덱스 정렬 기준이 달라진다. 둘 중 하나를 한다:
    #     docker compose down -v          # 로컬 데이터를 버리고 새로 만든다 (권장)
    #     docker compose exec db psql -U postgres -d arda -c 'REINDEX DATABASE arda;'
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # 로컬 전용. 실제 시크릿을 넣지 않는다
      POSTGRES_DB: arda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arda"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/arda
      # 로컬 개발 스택. 이 줄을 빼면 production 으로 잠겨(#122) JWT_SECRET 미설정과
      # 겹쳐 api 컨테이너가 기동하지 못한다. 서버는 docker-compose.prod.yml 이 별도다.
      APP_ENV: dev
      # 로컬 S3(MinIO). AWS 자격 없이 업로드(F1·F2)를 브라우저에서 돌려보기 위한 것.
      # presign 서명은 네트워크를 안 타므로 주소는 브라우저 기준(localhost)이면 된다.
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: arda-local
      AWS_ACCESS_KEY_ID: arda-local          # 로컬 전용. 실제 시크릿을 넣지 않는다
      AWS_SECRET_ACCESS_KEY: arda-local-secret
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app        # 코드 고치면 바로 반영
    depends_on:
      db:
        condition: service_healthy

  # 로컬 S3 (F1·F2). 브라우저가 presigned URL 로 localhost:9000 에 직접 올린다.
  # CORS 는 MinIO 기본값(모든 출처 허용)이라 별도 설정이 없다.
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: arda-local            # api 의 AWS 키와 반드시 같아야 서명이 맞는다
      MINIO_ROOT_PASSWORD: arda-local-secret
    ports:
      - "9000:9000"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 버킷 생성 one-shot. 이미 있으면 조용히 지나간다
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 arda-local arda-local-secret &&
      mc mb --ignore-existing local/arda-local
      "

  # worker:  # G2 SQS 메일 워커 — 3주차. 코드가 생기면 그때 연다
  #   build: ./backend
  #   command: uv run python -m app.worker
  #   depends_on:
  #     db:
  #       condition: service_healthy

volumes:
  pgdata:
  miniodata:
