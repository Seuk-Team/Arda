# docker-compose.yml (저장소 루트)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # 로컬 전용. 실제 시크릿을 넣지 않는다
      POSTGRES_DB: arda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arda"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/arda
      # 로컬 개발 스택. 이 줄을 빼면 production 으로 잠겨(#122) JWT_SECRET 미설정과
      # 겹쳐 api 컨테이너가 기동하지 못한다. 서버는 docker-compose.prod.yml 이 별도다.
      APP_ENV: dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app        # 코드 고치면 바로 반영
    depends_on:
      db:
        condition: service_healthy

  # worker:  # G2 SQS 메일 워커 — 3주차. 코드가 생기면 그때 연다
  #   build: ./backend
  #   command: uv run python -m app.worker
  #   depends_on:
  #     db:
  #       condition: service_healthy

volumes:
  pgdata:
