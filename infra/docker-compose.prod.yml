# Arda 프로덕션 compose — EC2 전용. 로컬 개발은 저장소 루트의 docker-compose.yml.
# 차이: --reload 제거, DB 포트 비공개, 워커 활성, restart 정책, env_file 주입.

# 컨테이너 로그 상한 (2026-09-07). 29GB 디스크에 상한 없이 쌓이면 09/01 처럼 배포가
# 디스크 고갈로 죽는다. 서비스당 20MB × 3 = 최대 60MB. 오래된 로그가 필요하면
# 그때 CloudWatch 로 보내지, 여기서 더 키우지 않는다.
# 프로젝트 이름 고정 (2026-09-09). compose 는 이름을 안 주면 **파일이 있는 폴더명** 을
# 쓴다 — 파일을 infra/ 아래로 옮기자 `arda-*` 옆에 `infra-*` 컨테이너·볼륨·네트워크가
# 통째로 한 벌 더 생겼고 (infra_pgdata 는 빈 DB), api·caddy·n8n 은 포트 충돌로 못 떴다.
# 이름을 박아 두면 파일을 어디로 옮겨도 arda-api-1 · arda_pgdata · arda_default 를 그대로
# 쓴다. deploy-arda.sh 의 `-p arda` 와 같은 값이어야 한다.
name: arda

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
      POSTGRES_DB: arda
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arda"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    # compose 파일이 infra/ 아래로 오면서 상대 경로가 저장소 루트가 아니라 infra/ 기준이다
    # (`./backend` 이면 infra/backend 를 찾아 없다고 죽는다, 2026-09-09 실측). 상위로.
    build: ../backend
    env_file: ../backend/.env
    command: /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ../backend
    env_file: ../backend/.env
    command: /app/.venv/bin/python -m app.worker
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy

  # 거짓말 탐지 (ai/lie-detection). 포트를 밖으로 열지 않는다 — Caddy 가 /ai/* 로만 넘긴다.
  # GPU 서버가 준비되면 이 서비스를 그쪽으로 옮긴다. 인터페이스(POST /analyze)가 같으므로
  # Caddyfile 의 reverse_proxy 주소만 바꾸면 되고 부르는 쪽은 바뀌지 않는다.
  lie-detection:
    build: ../ai/lie-detection
    # 이 컨테이너도 backend/.env 를 읽는다. STT_MODEL 이 없으면 전사가 꺼지고(#95),
    # 앞으로 붙을 판정 워커→백엔드 콜에 필요한 ARDA_SERVICE_TOKEN 도 같은 이유로 못 받는다.
    env_file: ../backend/.env
    # 전사 모델(large-v3-turbo ~1GB) 로드 시 idle ~1.2GB · 처리 피크 ~1.6GB
    # (soyeon Whisper 실측 574MiB/건). 1.5g 로 잡으면 실피크에서 죽을 여지 있어 2g 로
    # 여유. 서버 여유는 총 3.7GB — 다른 컨테이너(db 30MB · api·worker · caddy · n8n 상한
    # 768MB) 합쳐도 ~1GB 여유가 남는다. 상한 자체는 실사용을 늘리지 않는다 (커널이 이
    # 이상 못 쓰게 잘라라는 신호일 뿐) — 요금·다른 서비스에 영향 없음.
    mem_limit: 2g
    restart: unless-stopped
    logging: *default-logging

  # n8n — 알림·메일 자동화 계층 (ADR-0030 1단계, 2026-09-07). self-host 만, Cloud 금지.
  # 포트는 127.0.0.1 에만 연다 — 호스트의 status.sh·push-metrics.sh 가 헬스를 찌르기 위해서다.
  # 밖에서는 Caddy /n8n/* (Basic Auth) 로만. api 가 웹훅을 쏠 때는 docker 네트워크로
  # http://n8n:5678/n8n/webhook/... 를 직접 부른다(Basic Auth 안 거침).
  # N8N_ENCRYPTION_KEY 는 자격 증명 암호화 키 — 잃으면 n8n_data 백업을 복원해도 자격 증명을 못 푼다.
  # 버전 태그는 고정한다(2026-09-07 최신 안정판). 올릴 때는 `docker compose pull n8n && up -d n8n`
  # 뒤 편집 화면이 뜨는지 확인.
  n8n:
    image: n8nio/n8n:2.37.11
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: api.seuk.suvisdev.cloud
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      N8N_PATH: /n8n/
      WEBHOOK_URL: https://api.seuk.suvisdev.cloud/n8n/
      N8N_EDITOR_BASE_URL: https://api.seuk.suvisdev.cloud/n8n/
      N8N_PROXY_HOPS: "1"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set in .env — infra/.env.example}
      GENERIC_TIMEZONE: Asia/Seoul
      TZ: Asia/Seoul
      # 실행 기록은 14일만 — SQLite 가 29GB 디스크에서 무한히 크지 않게
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      # 외부로 나가는 진단·버전 알림·개인화 설문 전부 끔 (지원자 정보가 있는 서버다)
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      # 워크플로 표현식 안에서 $env.XXX 접근 허용 (2026-09-08 실측 확정).
      # n8n 2.x 기본은 차단(true) 이라 워크플로가 ARDA_INTERNAL_URL·ARDA_SERVICE_TOKEN 을
      # 못 읽어 렌더링 조회 노드가 "access to env vars denied" 로 죽는다.
      # 팀 공유 인스턴스라 우리 워크플로만 있고 다른 팀 워크플로가 host env 를 읽을 위험 없음.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # 워크플로가 우리 API 를 부를 때 쓰는 값 — 표현식 {{ $env.ARDA_INTERNAL_URL }} 로 읽는다
      ARDA_INTERNAL_URL: http://api:8000
      ARDA_SERVICE_TOKEN: ${ARDA_SERVICE_TOKEN:-}
    volumes:
      - n8n_data:/home/node/.n8n
    # t3.medium 4GB — api·worker·db·거짓말 탐지(574MiB/건)와 동거. 이 위로 크면 n8n 만 죽는다
    mem_limit: 768m
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # n8n 편집 화면 Basic Auth — 팀 전원 공유 (2026-09-07 결정: 누가 빠져도 나머지가 진행할 수 있게)
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-arda}
      N8N_BASIC_AUTH_HASH: ${N8N_BASIC_AUTH_HASH:?set in .env — infra/.env.example}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddyfile 은 infra/ 안이라 `./` 그대로, demo 는 저장소 루트라 `../` 로.
      - ../demo:/srv/demo:ro
      - caddy_data:/data
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
      - lie-detection
      - n8n


volumes:
  pgdata:
  caddy_data:
  n8n_data:
