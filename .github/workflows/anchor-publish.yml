# 사슬 머리를 공개 체인에 못 박는다 (ADR-0028 2·3단계)
#
# **여기서 도는 이유**: 폴리곤 서명에는 지갑 개인키가 필요한데, 그 키를 서버에
# 두면 서버 셸 접근이 곧 서명 권한이 된다. 인프라 오너 판단으로 키를 Actions
# secret 에 두기로 했다 (2026-09-04 팀장 검토 Q2·Q3).
#
# 덤으로 따라오는 것: 실패하면 Actions 가 알아서 알리고, 감사 로그가 남고,
# 서버 리소스를 안 쓴다.
#
# OTS(비트코인)는 개인키가 없어서 **서버가 직접** 도장을 찍는다. 여기서는
# API 를 한 번 부르기만 한다.
#
# 필요한 secret: ARDA_API_BASE · ARDA_API_EMAIL · ARDA_API_PASSWORD ·
#                CHAIN_RPC_URL · CHAIN_PRIVATE_KEY · CHAIN_NETWORK(선택)
#
# **토큰이 아니라 계정을 넣는다.** JWT 는 12시간이면 만료돼서(security.py
# JWT_EXPIRES_MINUTES) secret 에 박아 두면 하루 만에 cron 이 401 로 죽는다.
# 대신 워크플로가 매 실행마다 로그인해 새 토큰을 받는다.

name: 무결성 앵커 게시

on:
  schedule:
    # 매일 09:10 KST (00:10 UTC). 자정 정각을 피한 이유는 그 시각에 전 세계
    # cron 이 몰려 GitHub 큐가 밀리기 때문이다.
    - cron: "10 0 * * *"
  workflow_dispatch:  # 손으로도 돌릴 수 있게 — 시연 직전에 쓴다

# 겹쳐 돌면 같은 사슬 머리를 두 번 올리려다 한쪽이 409 로 죽는다. 줄을 세운다.
concurrency:
  group: anchor-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 키를 쥐는 잡이라 권한을 최소로 둔다.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # ci.yml · Dockerfile 의 python:3.12-slim 과 맞춘다

      - name: 의존성 설치
        working-directory: backend
        run: uv sync --frozen

      # JWT 는 12시간이면 만료된다. secret 에 토큰을 박아 두면 하루 만에 죽으므로
      # **매 실행마다 로그인해서 새로 받는다.** 받은 토큰은 add-mask 로 가려서
      # 뒤 단계 로그에 그대로 찍히지 않게 한다.
      - name: 로그인 (토큰 발급)
        env:
          ARDA_API_BASE: ${{ secrets.ARDA_API_BASE }}
          ARDA_API_EMAIL: ${{ secrets.ARDA_API_EMAIL }}
          ARDA_API_PASSWORD: ${{ secrets.ARDA_API_PASSWORD }}
        run: |
          code=$(curl -s -o /tmp/login.json -w "%{http_code}" \
            -X POST "$ARDA_API_BASE/auth/login" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg e "$ARDA_API_EMAIL" --arg p "$ARDA_API_PASSWORD" \
                  '{email:$e, password:$p}')")
          if [ "$code" -ne 200 ]; then
            # 본문에 비밀번호는 안 들어가지만 사유는 찍어야 고칠 수 있다
            echo "::error::로그인 실패 $code — $(cat /tmp/login.json)"
            exit 1
          fi
          token=$(jq -r '.access_token' /tmp/login.json)
          echo "::add-mask::$token"
          echo "ARDA_API_TOKEN=$token" >> "$GITHUB_ENV"

      - name: 폴리곤에 게시
        working-directory: backend
        env:
          ARDA_API_BASE: ${{ secrets.ARDA_API_BASE }}
          ARDA_API_TOKEN: ${{ env.ARDA_API_TOKEN }}
          CHAIN_RPC_URL: ${{ secrets.CHAIN_RPC_URL }}
          CHAIN_PRIVATE_KEY: ${{ secrets.CHAIN_PRIVATE_KEY }}
          CHAIN_NETWORK: ${{ secrets.CHAIN_NETWORK || 'polygon-amoy' }}
        run: uv run python scripts/publish_anchor.py

      - name: OpenTimestamps 에 도장 (서버가 찍는다 — 키 불필요)
        # 폴리곤이 실패해도 이쪽은 돌린다. 둘은 독립이고, 한쪽이 죽었다고
        # 다른 쪽 증명까지 포기할 이유가 없다.
        # 폴리곤이 실패해도 돌리지만, 토큰이 없으면(로그인 실패) 부를 수 없다
        if: always() && env.ARDA_API_TOKEN != ''
        env:
          ARDA_API_BASE: ${{ secrets.ARDA_API_BASE }}
          ARDA_API_TOKEN: ${{ env.ARDA_API_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/ots.json -w "%{http_code}" \
            -X POST "$ARDA_API_BASE/integrity/publish/ots" \
            -H "Authorization: Bearer $ARDA_API_TOKEN")
          echo "응답 $code"; cat /tmp/ots.json
          # 409 = 올릴 것이 없다. 실패가 아니다.
          if [ "$code" -ge 400 ] && [ "$code" -ne 409 ]; then exit 1; fi

      - name: 확정 안 된 게시 다시 확인
        # 어제 올린 폴리곤 거래·OTS 증명이 그새 확정됐는지 본다.
        # OTS 는 비트코인 블록을 기다리므로 보통 다음 날에야 confirmed 가 된다.
        # 폴리곤이 실패해도 돌리지만, 토큰이 없으면(로그인 실패) 부를 수 없다
        if: always() && env.ARDA_API_TOKEN != ''
        env:
          ARDA_API_BASE: ${{ secrets.ARDA_API_BASE }}
          ARDA_API_TOKEN: ${{ env.ARDA_API_TOKEN }}
        run: |
          curl -s -X POST "$ARDA_API_BASE/integrity/publications/refresh" \
            -H "Authorization: Bearer $ARDA_API_TOKEN" | head -c 2000

  # 실패를 사람이 보는 자리로 끌어낸다.
  #
  # **왜 필요한가**: 앵커는 안 돌아도 눈에 띄지 않는 종류다. 화면이 깨지지도,
  # 사용자가 항의하지도 않고 조용히 안 찍힌다. 실제로 2026-09-05·09-06 이틀
  # 연속 죽었는데 09-07 에 사람이 Actions 탭을 열어보고서야 알았다. 그동안
  # 접수된 제출물은 사슬에 안 올라가 나중에 위조를 검출할 근거가 없다.
  # GitHub 이 실패 메일을 보내긴 하지만 이틀 동안 아무도 반응하지 않았다 —
  # 팀이 실제로 보는 자리(이슈)로 옮긴다.
  #
  # **왜 별도 잡인가**: 위 잡은 지갑 개인키를 쥐고 있어서 `contents: read` 로
  # 좁혀 뒀다. 알림 때문에 그 잡에 `issues: write` 를 얹으면 키를 쥔 잡의
  # 권한이 넓어진다. 키를 안 만지는 잡을 따로 두고 여기에만 쓰기 권한을 준다.
  notify-failure:
    needs: publish
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 실패를 이슈로 알린다
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="🔴 무결성 앵커 게시 실패 — 사람이 봐야 한다"

          # 하루에 하나씩 새 이슈를 열면 조건이 오래가는 동안(예: 지갑 secret
          # 미설정) 이슈가 쌓여 아무도 안 본다. **열려 있는 것이 있으면 거기에
          # 코멘트만 붙인다** — 열린 이슈는 항상 최대 하나.
          # `--search` 는 GitHub 검색 색인을 타서 방금 연 이슈가 안 잡힐 수 있다.
          # 열린 이슈를 그냥 받아 와서 제목으로 거른다 — 색인 지연에 안 걸린다.
          existing=$(gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\") | .number] | first // empty")

          body=$(cat <<EOF
          앵커 게시 워크플로가 실패했습니다.

          - 실행: $RUN_URL
          - 시각(UTC): $(date -u '+%Y-%m-%d %H:%M')

          ## 먼저 볼 것

          1. **secret 이 비어 있는가** — 로그에 \`ARDA_API_BASE:\` 가 빈 값으로 찍혔으면 그것이다.
             필요한 것: \`ARDA_API_BASE\` · \`ARDA_API_EMAIL\` · \`ARDA_API_PASSWORD\`.
             계정은 **admin 롤**이어야 한다 (\`/integrity/publish/ots\` 가 admin 전용).
          2. **로그인 단계가 죽었는가** — 401 이면 계정·비밀번호, 그 외 상태 코드면 API 쪽.
          3. **\`OpenTimestamps 에 도장\` 단계가 죽었는가** — 이게 실패하면 그날 도장이 안 찍힌 것이다.
             201(찍음)·409(찍을 새 고리 없음)만 정상이다.

          ## 주의 — 폴리곤 단계만 빨간 것은 다른 이야기다

          지갑 secret(\`CHAIN_RPC_URL\`·\`CHAIN_PRIVATE_KEY\`)이 없으면 \`폴리곤에 게시\`
          단계는 \`체인 설정이 없습니다\` 로 **원래 실패한다.** 그 경우에도 OTS(비트코인)
          쪽은 정상으로 돈다. **\`OpenTimestamps 에 도장\` 단계가 초록인지를 먼저 보라.**

          ---
          이 이슈는 워크플로가 자동으로 열었습니다. 같은 실패가 반복되면 새 이슈 대신
          여기에 코멘트가 붙습니다. 고친 뒤 닫아 주세요.
          EOF
          )

          if [ -n "$existing" ]; then
            echo "이미 열린 이슈 #$existing 에 코멘트를 붙인다"
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            echo "새 이슈를 연다"
            gh issue create --repo "$REPO" --title "$TITLE" --body "$body" \
              --assignee woojeongalex
          fi
