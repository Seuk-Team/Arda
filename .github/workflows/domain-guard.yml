# 도메인 가드 — "자기 도메인만 셀프 머지"의 물리적 강제 (03-conventions 리뷰 절).
#
# 판정 규칙 (CODEOWNERS가 유일한 매핑 소스 — 여기에 경로를 적지 않는다):
#   - 변경 파일의 오너를 base 브랜치의 .github/CODEOWNERS로 판정 (마지막 매칭이 이김)
#   - 전부 작성자 소유            → 통과 (셀프 머지 가능)
#   - 타 도메인/공용 파일이 섞임   → 그 파일 오너의 승인 또는 팀장(* 규칙 오너) 승인 필요
#   - 팀장이 작성자               → 통과
# CODEOWNERS는 base 것을 읽으므로 PR이 스스로 규칙을 고쳐 통과할 수 없다.
# 이 체크를 branch protection의 required status check로 지정해야 강제가 완성된다.
name: domain-guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: domain-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) { core.setFailed("pull_request 컨텍스트 없음"); return; }
            const { owner, repo } = context.repo;
            const author = pr.user.login;

            // ── CODEOWNERS (base 브랜치) 파싱 ──────────────────────────
            const co = await github.rest.repos.getContent({
              owner, repo, path: ".github/CODEOWNERS", ref: pr.base.sha,
            });
            const lines = Buffer.from(co.data.content, "base64").toString("utf8").split("\n");
            const rules = []; // {pattern, owners[]} 파일 순서대로 — 마지막 매칭이 이긴다
            for (const raw of lines) {
              const line = raw.trim();
              if (!line || line.startsWith("#")) continue;
              const parts = line.split(/\s+/);
              const owners = parts.slice(1).filter(p => p.startsWith("@")).map(p => p.slice(1));
              if (owners.length) rules.push({ pattern: parts[0], owners });
            }
            const lead = (rules.find(r => r.pattern === "*") || { owners: [] }).owners[0];

            const ownersOf = (path) => {
              let matched = null;
              for (const r of rules) {
                const p = r.pattern;
                if (p === "*") { matched = r; continue; }
                const anchored = p.startsWith("/") ? p.slice(1) : p;
                if (anchored.endsWith("/")) {
                  if (path.startsWith(anchored)) matched = r;
                } else {
                  if (path === anchored) matched = r;
                }
              }
              return matched ? matched.owners : (lead ? [lead] : []);
            };

            // ── 팀장 작성 PR은 통과 ────────────────────────────────────
            if (author === lead) {
              core.info(`작성자 ${author} = 팀장(기본 오너) — 통과`);
              return;
            }

            // ── 변경 파일 판정 ─────────────────────────────────────────
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const outside = new Map(); // ownerKey("a,b") → [files]
            for (const f of files) {
              const paths = [f.filename];
              if (f.previous_filename) paths.push(f.previous_filename); // rename은 양쪽 다
              for (const path of paths) {
                const fo = ownersOf(path);
                if (!fo.includes(author)) {
                  const key = fo.join(",");
                  if (!outside.has(key)) outside.set(key, []);
                  outside.get(key).push(path);
                }
              }
            }
            if (outside.size === 0) {
              core.info(`전 파일이 ${author} 도메인 안 — 셀프 머지 가능`);
              return;
            }

            // ── 승인 확인 (사용자별 마지막 유효 리뷰 상태) ─────────────
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const lastState = new Map();
            for (const r of reviews) {
              if (["APPROVED", "CHANGES_REQUESTED", "DISMISSED"].includes(r.state)) {
                lastState.set(r.user.login, r.state);
              }
            }
            const approved = new Set(
              [...lastState].filter(([, s]) => s === "APPROVED").map(([u]) => u)
            );

            const unmet = [];
            for (const [key, paths] of outside) {
              const fo = key.split(",");
              const ok = fo.some(o => approved.has(o)) || (lead && approved.has(lead));
              if (!ok) unmet.push({ owners: fo, paths });
            }
            if (unmet.length === 0) {
              core.info("타 도메인 파일 있으나 필요한 승인 전부 확보 — 통과");
              return;
            }

            const msg = unmet.map(u =>
              `@${u.owners.join(" 또는 @")} 승인 필요:\n` + u.paths.map(p => `  - ${p}`).join("\n")
            ).join("\n");
            core.setFailed(
              `작성자(${author}) 도메인 밖 파일이 있습니다. 해당 오너 또는 팀장(@${lead})의 ` +
              `승인(Approve) 후 이 체크가 자동으로 다시 돕니다.\n${msg}`
            );
