<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아르 채팅 테스트</title>
<style>
  :root {
    --bg: #f8f9fa;
    --surface: #fff;
    --border: #dee2e6;
    --text: #212529;
    --text-muted: #6c757d;
    --primary: #4263eb;
    --primary-light: #edf2ff;
    --user-bg: #4263eb;
    --user-text: #fff;
    --bot-bg: #f1f3f5;
    --bot-text: #212529;
    --error: #e03131;
    --success: #2f9e44;
    --pending-bg: #fff3bf;
    --pending-border: #fcc419;
    --mono: "Consolas", "D2Coding", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Pretendard", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  .user-info {
    font-size: 13px;
    color: var(--text-muted);
  }
  .user-info strong { color: var(--text); }

  /* Login */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
  }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 360px;
  }
  .login-box h2 { font-size: 18px; margin-bottom: 20px; }
  .login-box label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .login-box input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  .login-box input:focus { outline: 2px solid var(--primary); border-color: transparent; }
  .login-box button {
    width: 100%;
    padding: 10px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .login-box button:hover { opacity: 0.9; }
  .login-error { color: var(--error); font-size: 13px; margin-top: 8px; display: none; }

  /* Chat */
  #chat-screen { display: none; flex-direction: column; flex: 1; overflow: hidden; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bg);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bg);
    color: var(--bot-text);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: center;
    background: #fff5f5;
    color: var(--error);
    border: 1px solid #ffc9c9;
    font-size: 13px;
  }
  .msg .meta {
    display: block;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    font-family: var(--mono);
  }
  .msg.bot .meta { color: #868e96; }

  /* Tool calls */
  .tool-calls {
    margin-top: 8px;
    padding: 8px;
    background: rgba(0,0,0,0.04);
    border-radius: 6px;
    font-size: 12px;
    font-family: var(--mono);
  }
  .tool-calls summary { cursor: pointer; color: var(--text-muted); }

  /* Pending action */
  .pending {
    margin-top: 8px;
    padding: 10px 12px;
    background: var(--pending-bg);
    border: 1px solid var(--pending-border);
    border-radius: 8px;
    font-size: 13px;
  }
  .pending .desc { margin-bottom: 8px; }
  .pending button {
    padding: 6px 16px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
    margin-right: 8px;
  }
  .pending .btn-confirm { background: var(--success); color: #fff; }
  .pending .btn-cancel { background: #e9ecef; color: var(--text); }

  /* Input */
  .input-bar {
    padding: 12px 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .input-bar input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
  }
  .input-bar input:focus { outline: 2px solid var(--primary); border-color: transparent; }
  .input-bar button {
    padding: 10px 20px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
  .typing { color: var(--text-muted); font-size: 13px; padding: 4px 0; display: none; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h2>아르 채팅 테스트</h2>
    <label for="email">이메일</label>
    <input type="email" id="email" placeholder="admin@example.com">
    <label for="password">비밀번호</label>
    <input type="password" id="password" placeholder="비밀번호">
    <label for="api-url">API URL (같은 서버면 비워두세요)</label>
    <input type="text" id="api-url" value="" placeholder="http://localhost:8000">
    <button onclick="doLogin()">로그인</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="chat-screen">
  <header>
    <h1>아르 채팅 테스트</h1>
    <div class="user-info">
      <strong id="display-name"></strong>
      <span id="display-role"></span>
    </div>
  </header>
  <div class="messages" id="messages"></div>
  <div class="typing" id="typing">아르가 답변 중...</div>
  <div class="input-bar">
    <input type="text" id="chat-input" placeholder="메시지를 입력하세요" onkeydown="if(event.key==='Enter')sendMsg()">
    <button id="send-btn" onclick="sendMsg()">전송</button>
  </div>
</div>

<script>
let API = '';
let TOKEN = '';
let USER = {};
let history = [];

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('password').value;
  API = document.getElementById('api-url').value.replace(/\/+$/, '');
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';

  try {
    const res = await fetch(API + '/api/v1/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password: pw})
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.message || '로그인 실패');
    }
    const data = await res.json();
    TOKEN = data.access_token;

    const meRes = await fetch(API + '/api/v1/auth/me', {
      headers: {'Authorization': 'Bearer ' + TOKEN}
    });
    USER = await meRes.json();

    document.getElementById('display-name').textContent = USER.name;
    document.getElementById('display-role').textContent = '(' + USER.role + ')';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('chat-screen').style.display = 'flex';
    document.getElementById('chat-input').focus();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

function addMsg(role, text, meta, toolCalls, pendingAction) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;

  if (meta) {
    const m = document.createElement('span');
    m.className = 'meta';
    m.textContent = meta;
    el.appendChild(m);
  }

  if (toolCalls && toolCalls.length > 0) {
    const details = document.createElement('details');
    details.className = 'tool-calls';
    const summary = document.createElement('summary');
    summary.textContent = 'tool calls (' + toolCalls.length + ')';
    details.appendChild(summary);
    toolCalls.forEach(tc => {
      const pre = document.createElement('pre');
      pre.textContent = tc.name + '(' + JSON.stringify(tc.input, null, 2) + ')';
      details.appendChild(pre);
    });
    el.appendChild(details);
  }

  if (pendingAction) {
    const pDiv = document.createElement('div');
    pDiv.className = 'pending';
    const desc = document.createElement('div');
    desc.className = 'desc';
    desc.textContent = pendingAction.description;
    pDiv.appendChild(desc);

    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'btn-confirm';
    confirmBtn.textContent = '확인';
    confirmBtn.onclick = () => doConfirm(pendingAction, pDiv);

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-cancel';
    cancelBtn.textContent = '취소';
    cancelBtn.onclick = () => {
      pDiv.innerHTML = '<div style="color:#868e96">취소됨</div>';
    };

    pDiv.appendChild(confirmBtn);
    pDiv.appendChild(cancelBtn);
    el.appendChild(pDiv);
  }

  const container = document.getElementById('messages');
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
}

async function doConfirm(action, pDiv) {
  pDiv.innerHTML = '<div style="color:#868e96">처리 중...</div>';
  try {
    const res = await fetch(API + '/api/v1/agent/confirm', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + TOKEN
      },
      body: JSON.stringify({tool_name: action.tool_name, arguments: action.arguments})
    });
    const data = await res.json();
    if (res.ok && data.ok) {
      pDiv.innerHTML = '<div style="color:var(--success)">완료: ' + JSON.stringify(data.result) + '</div>';
    } else {
      pDiv.innerHTML = '<div style="color:var(--error)">실패: ' + (data.message || JSON.stringify(data)) + '</div>';
    }
  } catch (e) {
    pDiv.innerHTML = '<div style="color:var(--error)">오류: ' + e.message + '</div>';
  }
}

async function sendMsg() {
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('send-btn');
  const msg = input.value.trim();
  if (!msg) return;

  input.value = '';
  btn.disabled = true;
  addMsg('user', msg);
  history.push({role: 'user', content: msg});

  document.getElementById('typing').style.display = 'block';

  try {
    const start = performance.now();
    const res = await fetch(API + '/api/v1/agent/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + TOKEN
      },
      body: JSON.stringify({message: msg, history: history.slice(0, -1)})
    });
    const elapsed = Math.round(performance.now() - start);

    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.message || 'HTTP ' + res.status);
    }

    const data = await res.json();
    const meta = data.model + ' | ' + data.input_tokens + '+' + data.output_tokens + ' tok | $' + data.cost_usd + ' | ' + elapsed + 'ms';

    addMsg('bot', data.reply, meta, data.tool_calls, data.pending_action);
    history.push({role: 'assistant', content: data.reply});
  } catch (e) {
    addMsg('error', e.message);
  } finally {
    document.getElementById('typing').style.display = 'none';
    btn.disabled = false;
    input.focus();
  }
}
</script>
</body>
</html>
