[project]
name = "arda-backend"
version = "0.1.0"
description = "Arda ATS 백엔드 (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "boto3>=1.43.79",
    "anthropic>=0.52",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "python-multipart>=0.0.9",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    # torch 는 sentence-transformers 의 전이 의존이지만, [tool.uv.sources] 는
    # 프로젝트가 직접 선언한 의존에만 적용되므로 여기 명시한다.
    "torch>=2.0",
    "pypdf>=6.16.2",
    "web3>=7.0",
]

# 로컬 STT. 기본 설치에서 뺀 이유: 운영 API 는 t3.micro(RAM 1GiB)라 ctranslate2 까지
# 얹으면 기동이 위태롭고, STT 를 로컬로 돌리는 것은 GPU 있는 장비에서만 하기 때문이다.
#   uv sync --extra local
[project.optional-dependencies]
local = [
    "faster-whisper>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # 스키마 마이그레이션 도구(5941ae7). 런타임 의존이 아니라서 dev 그룹이다 —
    # 운영 이미지는 `uv sync --frozen --no-dev` 라 들어가지 않는다(backend/Dockerfile).
    # 여기 없으면 `uv run --with alembic` 로 매번 최신을 받아 쓰게 되고, 그러면
    # **버전이 아무 데도 안 박혀 사람마다 다른 alembic 으로 같은 리비전을 돌린다.**
    "alembic>=1.13",
    "pytest-timeout>=2.3",
]

[tool.uv]
package = false

# 운영은 EC2 t3.micro (GPU 없음). PyPI 기본 torch 는 Linux 에서 CUDA 런타임
# (nvidia-*, cuda-toolkit) 을 끌고 와 배포 이미지가 수 GB 커진다.
# Linux 만 PyTorch CPU 전용 인덱스로 고정한다 — Windows/macOS 의 PyPI 기본 휠은
# 이미 CPU-only 라 건드리지 않는다(팀원 환경 영향 없음).
# https://docs.astral.sh/uv/guides/integration/pytorch/
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
# hang 을 침묵 대신 실패로 바꾼다 — 2026-09-04 로컬에서 Docker Desktop 이 죽어
# DB connect 대기로 pytest 가 24분간 조용히 멈춘 사고의 재발 방지. 타임아웃이
# 걸리면 어떤 테스트가 어디서 기다렸는지 스택과 함께 실패로 드러난다.
timeout = 60
