[project]
name = "arda-backend"
version = "0.1.0"
description = "Arda ATS 백엔드 (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "boto3>=1.43.79",
    "anthropic>=0.52",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
