# 적합도 확인용 지원자 데이터셋 (2026-09-10) — docs/07_eval/fit-check-2026-09.md 가 설명서.
#
# 목적: 코드브릿지 채용 요강(docs/06_company/01-채용요강-2026-09.md) 두 개에 대해
# 아르의 요약·적합도(fit_score)·추천과 의미 검색이 "회사에 맞는 사람"을 실제로 앞에
# 세우는지 데이터로 본다. 멘토링(09-10) 2·8번.
#
# 필드는 공개 지원 폼(POST /public/postings/{id}/applications, ApplicationCreate)과 같다.
# 이력서 파일은 안 붙인다 — 요약기는 파일이 없으면 폼 필드 + self_intro 로 돈다.
# expect.tier: A = 요건 대부분 충족 (fit_score 4~5 기대) · B = 일부 충족 (3) · C = 무관/부족 (1~2)
# expect.why: 사람이 보는 정답 근거. 결과 표에서 아르의 fit/concerns 와 대조한다.
#
# 이메일은 fitcheck-<역할>-<번호>@example.com — 시연 계정과 같은 도메인이라 앱 로그인
# 단축(test1 → @example.com)도 그대로 쓸 수 있다. 생년월일은 전부 1995-01-01.

