# alembic 설정 (2026-09-01 도입)
#
# **alembic 은 런타임 의존성이 아니다.** pyproject·uv.lock 을 건드리지 않으려고
# 일부러 뺐다 — Dockerfile 이 uv 0.5.11 로 핀돼 있는데 uv.lock 은 그보다 새 uv 가
# 쓴 형식이라, 지금 잠금 파일을 다시 쓰면 이미지 빌드가 깨질 수 있다.
# 그래서 필요한 사람이 그때만 받아 쓴다:
#
#     uv run alembic upgrade head
#
# 게이트가 지나고 빌드 파이프라인이 안정되면 정식 의존성으로 옮긴다.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# sqlalchemy.url 은 여기 적지 않는다 — env.py 가 DATABASE_URL 환경변수를 읽는다.
# 접속 문자열에 비밀번호가 들어가므로 저장소에 남기지 않는다.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
